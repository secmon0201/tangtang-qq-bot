[project]
name = "tangtang-harness"
version = "0.1.0"
description = "Independent Windows-local QQ agent harness"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1", "websockets>=14,<16", "python-dotenv>=1,<2",
  "Pillow>=11,<13", "loguru>=0.7,<1", "truststore>=0.10,<1",
  "Brotli>=1,<2", "playwright>=1.61,<2", "bilibili-api-python>=17.4,<18",
  "python-multipart>=0.0.20,<1", "psutil>=6,<8"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2"]

[project.scripts]
tangtang-harness = "tangtang_harness.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tangtang_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

