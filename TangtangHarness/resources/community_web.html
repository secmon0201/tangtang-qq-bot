:26px 0;border-top:1px solid rgba(79,75,108,.12);color:var(--help-muted);font-size:14px}.help-footer strong{color:var(--help-deep)}.help-toast{position:fixed;right:20px;bottom:20px;z-index:50;max-width:min(360px,calc(100vw - 40px));padding:13px 17px;color:#fff;background:rgba(63,62,86,.94);border:1px solid rgba(255,255,255,.18);border-radius:6px;box-shadow:0 14px 34px rgba(63,62,86,.25);font-weight:900;opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .18s ease,transform .18s ease;backdrop-filter:blur(16px)}.help-toast.is-visible{opacity:1;transform:translateY(0)}
    @media(max-width:900px){body[data-mode="help"] .interactive-bar{grid-template-columns:1fr;gap:8px}body[data-mode="help"] .interactive-brand{justify-content:center}body[data-mode="help"] .control-row{grid-template-columns:repeat(3,minmax(0,1fr))}.help-hero{grid-template-columns:1fr;gap:30px}.help-visual{min-height:300px}.help-avatar-frame{width:min(56%,280px)}.help-section-heading{grid-template-columns:1fr}.help-item{grid-template-columns:1fr}.help-subsection-header{align-items:flex-start;flex-direction:column;gap:4px}}
    @media(max-width:720px){.shell{padding:12px}.community-card{border-radius:22px}.community-card::before{width:14px}.side-rail{left:0;width:13px;font-size:7px}.masthead{grid-template-columns:1fr;gap:20px;padding:40px 20px 25px 39px}.title-kicker{font-size:10px}.masthead h1{grid-template-columns:auto minmax(0,1fr)}.title-primary{padding-right:10px;font-size:48px}.title-secondary{padding:0 0 4px 11px;border-left-width:2px;font-size:26px}.title-meta{margin-top:12px;font-size:14px}.headline-side{grid-template-columns:92px minmax(0,1fr);gap:8px}.date-seal{font-size:55px}.signal{min-width:0;padding:17px 18px}.signal strong{font-size:37px}.signal span{font-size:12px}.content{padding:4px 14px 8px 38px}.chapter{min-height:36px;padding-inline:10px;font-size:11px}.ranking-row{min-height:64px;grid-template-columns:42px 50px minmax(0,1fr);gap:9px;padding:8px}.ranking-row.row-first{min-height:70px}.rank{font-size:17px}.row-first .rank{font-size:23px}.avatar{width:48px;height:48px}.row-first .avatar{width:54px;height:54px;margin-left:-3px}.person strong{font-size:16px}.person span{font-size:11px}.count{grid-column:3;justify-self:start}.count strong{font-size:18px}.chart-heading{align-items:flex-start;flex-direction:column}.chart-section{padding:20px 10px 14px}.chart-heading h2{font-size:20px}.chart-scroll{overflow-x:auto;overscroll-behavior-inline:contain}.chart-plot{width:760px;max-width:none}.footer{align-items:flex-start;flex-direction:column;padding:18px 18px 22px 39px}.control-row{flex-wrap:nowrap;overflow-x:auto}.control-row button{flex:0 0 auto;padding:0 12px}body[data-mode="help"] .interactive-bar{padding-inline:12px}body[data-mode="help"] .control-row{display:flex;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-inline:contain;padding:2px 3px 6px;scrollbar-width:thin;scroll-snap-type:x proximity}body[data-mode="help"] .control-row button{flex:0 0 auto;min-width:118px;scroll-snap-align:start}body[data-mode="help"] .shell{width:min(100% - 24px,1240px);padding:0}.help-hero{min-height:0;padding:38px 0 44px}.help-hero h1{font-size:47px}.help-hero p{font-size:16px}.help-visual{min-height:190px}.help-avatar-frame{width:155px}.help-float-tag{font-size:13px}.help-workspace{padding:48px 0 68px}.help-section-heading h2{font-size:39px}.help-quick-links{padding:12px}.help-quick-links-label{width:100%}.help-online-link,.help-copy-button{min-height:46px}.help-item{gap:18px;padding:19px}.help-item h4{font-size:20px}.help-command{font-size:14px}.help-item-actions>*{flex:1 1 150px}.help-footer{align-items:flex-start;flex-direction:column}}
    @media(max-width:420px){.help-hero h1{font-size:41px}.help-summary span{width:100%;text-align:center}}
    @media(prefers-reduced-motion:reduce){body[data-mode="help"] *,body[data-mode="help"] *::before,body[data-mode="help"] *::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}

<body class="__COMMUNITY_CAPTURE_CLASS__" data-mode="__COMMUNITY_MODE__">
  <a class="skip-link" href="#capture-root">跳到主要内容</a>
  <div class="page">
    <header class="interactive-bar"><div class="interactive-brand"><img class="interactive-avatar" src="/assets/tangtang-avatar.jpg" alt=""><span id="interactive-title">AK bot</span></div><div class="control-row" id="primary-controls"></div><div class="control-row" id="secondary-controls"></div></header>
    <main class="shell"><article id="capture-root" class="capture"><div class="loading">正在整理社区数据...</div></article></main>
  </div>
  <script>
  (() => {
    const embedded = __COMMUNITY_PAYLOAD_JSON__;
    const root = document.querySelector('#capture-root');
    const mode = document.body.dataset.mode;
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const base = kind => {
      if (kind === 'ranking' && location.pathname.startsWith('/ranking/')) {
        const path = location.pathname.replace(/\/+$/, '');
        return `${path}/api`;
      }
      return `/${kind}/api`;
    };
    const query = () => new URLSearchParams(location.search);
    const setControls = (element, items, current, attribute, change) => {
      element.innerHTML = items.map(item => `<button type="button" data-${attribute}="${esc(item.key)}" aria-selected="${String(item.key === current)}">${esc(item.label)}</button>`).join('');
      element.querySelectorAll('button').forEach(button => button.addEventListener('click', () => change(button.dataset[attribute])));
    };
    const avatarMarkup = (avatar, label) => avatar
      ? `<span class="avatar"><img src="${esc(avatar)}" alt=""></span>`
      : `<span class="avatar" aria-hidden="true">${esc(String(label || '?').trim().slice(0, 1) || '?')}</span>`;
    const niceUpper = maximum => {
      if (maximum <= 0) return 4;
      const rough = maximum / 4;
      const power = 10 ** Math.floor(Math.log10(rough));
      const fraction = rough / power;
      const nice = fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10;
      return nice * power * 4;
    };
    function renderChart(chart) {
      const rows = chart?.rows || [];
      if (!rows.length) return '';
      const width = 900, left = 86, right = 32, top = 58, bottom = 236;
      const groupChart = chart.kind === 'group';
      const labelY = groupChart ? bottom + 87 : bottom + 38;
      const axisTitleY = groupChart ? bottom + 125 : bottom + 78;
      const svgHeight = groupChart ? bottom + 140 : bottom + 94;
      const avatarY = bottom + 43;
      const maximum = Math.max(0, ...rows.map(row => Number(row.message_count || 0)));
      const upper = niceUpper(maximum);
      const x = index => rows.length === 1 ? (left + width - right) / 2 : left + (width - left - right) * index / (rows.length - 1);
      const y = value => bottom - (bottom - top) * Number(value || 0) / upper;
      const grid = Array.from({length:5}, (_, index) => {
        const gy = top + (bottom - top) * index / 4;
        const value = upper - upper * index / 4;
        return `<line class="chart-grid" x1="${left}" y1="${gy}" x2="${width-right}" y2="${gy}"></line><text class="chart-scale" x="${left-14}" y="${gy+5}">${esc(Math.round(value))}</text>`;
      }).join('');
      const points = rows.map((row, index) => `${x(index)},${y(row.message_count)}`).join(' ');
      const area = `M ${rows.map((row, index) => `${x(index)} ${y(row.message_count)}`).join(' L ')} L ${x(rows.length-1)} ${bottom} L ${x(0)} ${bottom} Z`;
      const clips = groupChart ? rows.map((_, index) => `<clipPath id="chart-avatar-clip-${index}"><circle cx="${x(index)}" cy="${avatarY}" r="21"></circle></clipPath>`).join('') : '';
      const markers = rows.map((row, index) => `<text class="chart-value" x="${x(index)}" y="${Math.max(18, y(row.message_count) - 18)}">${esc(row.message_count)}</text><circle class="chart-point" cx="${x(index)}" cy="${y(row.message_count)}" r="7"></circle>`).join('');
      const axisLabels = rows.map((row, index) => `<text class="chart-x-label" x="${x(index)}" y="${labelY}">${esc(row.label)}</text>`).join('');
      const avatars = groupChart ? rows.map((row, index) => {
        const px = x(index);
        const image = row.avatar
          ? `<image class="chart-avatar" data-center-x="${px}" href="${esc(row.avatar)}" x="${px-21}" y="${avatarY-21}" width="42" height="42" clip-path="url(#chart-avatar-clip-${index})"></image>`
          : `<text class="chart-avatar-fallback" data-center-x="${px}" x="${px}" y="${avatarY+6}">${esc(String(row.label || '?').slice(0,1))}</text>`;
        return `<circle class="chart-avatar-back" data-center-x="${px}" cx="${px}" cy="${avatarY}" r="23"></circle>${image}`;
      }).join('') : '';
      const axisKey = groupChart ? '横轴 · 群' : '横轴 · 日期';
      const table = `<table class="sr-only"><caption>${esc(chart.title)}</caption><thead><tr><th>${esc(chart.x_axis_label)}</th><th>${esc(chart.y_axis_label)}</th></tr></thead><tbody>${rows.map(row => `<tr><td>${esc(row.label)}</td><td>${esc(row.message_count)}</td></tr>`).join('')}</tbody></table>`;
      return `<section class="chart-section"><div class="chart-heading"><div><h2>${esc(chart.title)}</h2><p>${esc(chart.subtitle)}</p></div><span class="chart-axis-key">${axisKey}</span></div><div class="chart-scroll"><svg class="chart-plot" viewBox="0 0 ${width} ${svgHeight}" role="img" aria-label="${esc(chart.title)}"><defs><linearGradient id="ranking-line" x1="0" x2="1"><stop offset="0" stop-color="#f26f82"></stop><stop offset=".5" stop-color="#8d67ce"></stop><stop offset="1" stop-color="#47c9b5"></stop></linearGradient><linearGradient id="ranking-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d67ce" stop-opacity=".72"></stop><stop offset="1" stop-color="#47c9b5" stop-opacity="0"></stop></linearGradient>${clips}</defs>${grid}<line class="chart-axis" x1="${left}" y1="${top}" x2="${left}" y2="${bottom}"></line><line class="chart-axis" x1="${left}" y1="${bottom}" x2="${width-right}" y2="${bottom}"></line><text class="chart-axis-title" x="23" y="${(top+bottom)/2}" transform="rotate(-90 23 ${(top+bottom)/2})">${esc(chart.y_axis_label)}</text><path class="chart-area" d="${area}"></path><polyline class="chart-line" points="${points}"></polyline>${markers}${avatars}${axisLabels}<text class="chart-axis-title" x="${(left+width-right)/2}" y="${axisTitleY}">${esc(chart.x_axis_label)}</text></svg></div>${table}</section>`;
    }
    const chapters = {
      1: ['TOP 03', '聚光席位'],
      4: ['RANK 04 — 10', '前排应援'],
      11: ['RANK 11 — 20', '主舞台区'],
      21: ['RANK 21+', '持续在线'],
    };
    const rankingRowMarkup = row => {
      const rank = Number(row.rank || 0);
      const chapter = chapters[rank];
      const tier = rank === 1 ? 'row-first' : rank <= 10 ? 'row-top' : 'row-main';
      const chapterMarkup = chapter ? `<li class="chapter"><span>${chapter[0]}</span><small>${chapter[1]}</small></li>` : '';
      return `${chapterMarkup}<li class="ranking-row ${tier}"><span class="rank">${esc(String(rank).padStart(2,'0'))}</span>${avatarMarkup(row.avatar, row.nickname)}<div class="person"><strong>${esc(row.nickname)}</strong>${row.group_name ? `<span>${esc(row.group_name)}</span>` : ''}</div><span class="count"><strong>${esc(row.message_count)}</strong><small>条</small></span></li>`;
    };
    function renderRanking(data) {
      document.title = `${data.title} · AK bot`;
      document.querySelector('#interactive-title').textContent = data.title || '发言榜';
      setControls(document.querySelector('#primary-controls'), data.scope_options, data.scope, 'scope', scope => loadRanking(scope, data.group));
      setControls(document.querySelector('#secondary-controls'), data.group_options, data.group, 'group', group => loadRanking(data.scope, group));
      const ranking = data.rows?.length
        ? `<ol class="ranking-list">${data.rows.map(rankingRowMarkup).join('')}</ol>`
        : '<div class="empty">本次统计范围内暂无发言记录。</div>';
      const month = esc(data.generated_month || '--');
      const day = esc(data.generated_day || '--');
      root.innerHTML = `<article class="community-card"><span class="side-rail">AK-BOT FUNCTION</span><i class="glow glow-a" aria-hidden="true"></i><i class="glow glow-b" aria-hidden="true"></i><i class="glow glow-c" aria-hidden="true"></i><section class="masthead"><div class="title-lockup"><p class="title-kicker">${esc(data.header_kicker)}</p><h1><span class="title-primary">${esc(data.group_label)}</span><em class="title-secondary">${esc(data.scope_title)}</em></h1><p class="title-meta">${esc(data.generated_date)} · 展示前 ${esc(data.displayed_count)} 名</p></div><div class="headline-side"><div class="date-seal" aria-label="${month}月${day}日"><span>${month}</span><span>${day}</span></div><div class="signal"><strong>${Number(data.message_total || 0)}</strong><span>条发言记录</span></div></div></section><div class="content">${ranking}${renderChart(data.chart)}</div><footer class="footer"><span>${esc(data.subtitle)}</span><strong>AK bot</strong></footer></article>`;
    }
    let cachedHelp = null;
    let helpToastTimer = 0;
    const helpLinkMarkup = action => `<a class="help-online-link" href="${esc(action.target)}">${esc(action.label)}</a>`;
    const helpItemMarkup = item => {
      const actions = (item.actions || []).map(helpLinkMarkup).join('');
      return `<article class="help-item"><div class="help-item-copy"><h4>${esc(item.title)}</h4><p>${esc(item.description)}</p></div><div><div class="help-command">${esc(item.command)}</div><div class="help-item-actions"><button class="help-copy-button" type="button" data-copy-command="${esc(item.command)}">复制这一组指令</button>${actions}</div></div></article>`;
    };
    function showHelpToast(message) {
      const toast = document.querySelector('#help-toast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('is-visible');
      window.clearTimeout(helpToastTimer);
      helpToastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 1800);
    }
    async function copyHelpCommand(command, button) {
      const originalLabel = button?.textContent || '复制这一组指令';
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(command);
        else {
          const input = document.createElement('textarea');
          try {
            input.value = command;
            input.setAttribute('readonly', '');
            input.style.position = 'fixed';
            input.style.opacity = '0';
            document.body.appendChild(input);
            input.select();
            if (!document.execCommand('copy')) throw Error();
          } finally {
            input.remove();
          }
        }
        if (button) {
          button.textContent = '已复制';
          window.setTimeout(() => { button.textContent = originalLabel; }, 1800);
        }
        showHelpToast('指令已复制，可以回到 QQ 发送');
      } catch {
        showHelpToast('复制失败，请长按指令手动复制');
      }
    }
    root.addEventListener('click', event => {
      const button = event.target.closest('[data-copy-command]');
      if (button) copyHelpCommand(button.dataset.copyCommand || '', button);
    });
    function helpGroups(data) {
      if (data.groups?.length) return data.groups;
      return (data.categories || []).map((category, index) => ({
        key: `category-${index + 1}`,
        label: category.title,
        title: category.title,
        description: category.note || data.subtitle,
        sections: [category],
        quick_actions: [],
        item_count: category.items?.length || 0,
      }));
    }
    function updateHelpLocation(category, method) {
      const next = new URL(location.href);
      next.searchParams.set('category', category);
      history[method === 'push' ? 'pushState' : 'replaceState']({}, '', next);
    }
    function selectHelpGroup(data, category, method = 'push') {
      const groups = helpGroups(data);
      const current = groups.find(group => group.key === category) || groups[0];
      if (!current) return;
      renderHelp(data, current.key);
      updateHelpLocation(current.key, method);
    }
    function configureHelpTabs(data, currentKey) {
      const controls = document.querySelector('#primary-controls');
      const tabs = [...controls.querySelectorAll('button')];
      controls.setAttribute('role', 'tablist');
      controls.setAttribute('aria-label', '帮助分类');
      tabs.forEach(tab => {
        tab.setAttribute('role', 'tab');
        tab.setAttribute('aria-controls', 'help-panel');
        tab.tabIndex = tab.dataset.category === currentKey ? 0 : -1;
      });
      controls.onkeydown = event => {
        const currentTab = event.target.closest('[data-category]');
        if (!currentTab) return;
        const index = tabs.indexOf(currentTab);
        let nextIndex = index;
        if (event.key === 'ArrowRight' || event.key === 'ArrowDown') nextIndex = (index + 1) % tabs.length;
        else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') nextIndex = (index - 1 + tabs.length) % tabs.length;
        else if (event.key === 'Home') nextIndex = 0;
        else if (event.key === 'End') nextIndex = tabs.length - 1;
        else return;
        event.preventDefault();
        const nextKey = tabs[nextIndex].dataset.category;
        selectHelpGroup(data, nextKey, 'push');
        document.querySelector(`[data-category="${CSS.escape(nextKey)}"]`)?.focus();
      };
    }
    function renderHelp(data, requestedCategory) {
      cachedHelp = data;
      document.title = `${data.title || '糖糖在线帮助'} · AK bot`;
      document.querySelector('#interactive-title').textContent = '糖糖在线帮助';
      const groups = helpGroups(data);
      const current = groups.find(group => group.key === requestedCategory) || groups[0];
      if (!current) {
        root.innerHTML = '<div class="error">帮助内容暂时为空。</div>';
        return;
      }
      const controls = document.querySelector('#primary-controls');
      setControls(controls, groups.map(group => ({key:group.key,label:group.label})), current.key, 'category', category => selectHelpGroup(data, category, 'push'));
      configureHelpTabs(data, current.key);
      document.querySelector('#secondary-controls').innerHTML = '';
      const totalItems = groups.reduce((total, group) => total + Number(group.item_count || 0), 0);
      const groupIndex = groups.findIndex(group => group.key === current.key) + 1;
      const quickActions = (current.quick_actions || []).map(helpLinkMarkup).join('');
      const sections = (current.sections || []).map(section => `<section class="help-subsection"><header class="help-subsection-header"><h3>${esc(section.title)}</h3>${section.note ? `<p>${esc(section.note)}</p>` : ''}</header><div class="help-list">${(section.items || []).map(helpItemMarkup).join('')}</div></section>`).join('');
      root.innerHTML = `<article class="help-surface"><section class="help-hero"><div><div class="help-brandline">AK-BOT FUNCTION</div><h1>群友用法，<br><span>按场景查</span></h1><p>${esc(data.subtitle)}</p><div class="help-summary"><span>${groups.length} 个功能大类</span><span>${totalItems} 项公开入口</span><span>本群设置只影响当前群</span></div></div><div class="help-visual" aria-hidden="true"><div class="help-grid-backdrop"></div><div class="help-avatar-frame"><img src="/assets/tangtang-avatar.jpg" alt=""></div><span class="help-float-tag one">#帮助</span><span class="help-float-tag two">WEB + QQ</span></div></section><section class="help-workspace" id="help-panel" role="tabpanel"><header class="help-section-heading"><div><span class="help-section-index">功能 ${String(groupIndex).padStart(2, '0')} / ${String(groups.length).padStart(2, '0')}</span><h2>${esc(current.title)}</h2></div><p>${esc(current.description)}</p></header><nav class="help-quick-links" aria-label="在线快捷入口" ${quickActions ? '' : 'hidden'}><span class="help-quick-links-label">直接打开网页</span>${quickActions}</nav><div class="help-groups">${sections}</div></section><footer class="help-footer"><span>帮助内容与普通群友和本群管理员可见入口同步</span><strong>AK bot</strong></footer><div class="help-toast" id="help-toast" role="status" aria-live="polite"></div></article>`;
    }
    async function loadRanking(scope, group) {
      root.innerHTML = '<div class="loading">正在汇总发言数据...</div>';
      try {
        const response = await fetch(`${base('ranking')}?scope=${encodeURIComponent(scope)}&group=${encodeURIComponent(group)}`);
        if (!response.ok) throw Error();
        const data = await response.json();
        renderRanking(data);
        const next = new URL(location.href);
        next.searchParams.set('scope', data.scope);
        next.searchParams.set('group', data.group);
        history.replaceState({}, '', next);
      } catch {
        root.innerHTML = '<div class="error">发言榜暂时无法读取，请稍后刷新。</div>';
      }
    }
    async function loadHelp(category) {
      root.innerHTML = '<div class="loading">正在整理帮助内容...</div>';
      try {
        const response = await fetch(base('help'));
        if (!response.ok) throw Error();
        const data = await response.json();
        selectHelpGroup(data, category, 'replace');
      } catch {
        root.innerHTML = '<div class="error">帮助内容暂时无法读取，请稍后刷新。</div>';
      }
    }
    window.addEventListener('popstate', () => {
      if (mode === 'help' && cachedHelp) renderHelp(cachedHelp, query().get('category') || 'start');
    });
    if (embedded) {
      mode === 'ranking' ? renderRanking(embedded) : renderHelp(embedded, query().get('category') || 'start');
      return;
    }
    if (mode === 'ranking') loadRanking(query().get('scope') || 'day', query().get('group') || 'domain');
    else loadHelp(query().get('category') || 'start');
  })();
  </script>
</body>
