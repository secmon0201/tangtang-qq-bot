<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>枝江直播日历 · 糖糖</title>
  <style>
    :root {
      --paper: #ffffff;
      --ink: #17181c;
      --muted: #755361;
      --line: #ead0dc;
      --soft: #fff3f7;
      --pink: #f25d8e;
      --xinyi-pink: #ff4f91;
      --xinyi-blush: #ffe1ec;
      --xinyi-wine: #6f2548;
      --xinyi-ink: #30232b;
      --xinyi-lilac: #d8ccff;
      --xinyi-silver: #c5c8d0;
      --cyan: #18a9c5;
      --lime: #b8ef3d;
      --red: #ef3f5d;
      --gold: #d5a841;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    html { background: var(--soft); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--soft);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      letter-spacing: 0;
    }
    button { font: inherit; letter-spacing: 0; }
    .page { min-height: 100vh; }
    .interactive-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 15px max(20px, calc((100vw - 1080px) / 2));
      color: #755367;
      background: repeating-linear-gradient(135deg, #f9dfe9 0 16px, #efd0dd 16px 18px);
      border-bottom: 2px solid #aa7f90;
      box-shadow: 0 6px 0 rgba(234, 215, 223, .78);
    }
    .interactive-brand {
      position: relative;
      padding: 9px 16px;
      color: #755367;
      background: rgba(255, 255, 255, .9);
      border: 1px solid #aa7f90;
      box-shadow: 4px 4px 0 #ead7df;
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
    }
    .interactive-brand::after {
      content: "";
      position: absolute;
      top: 7px;
      right: 7px;
      width: 7px;
      height: 7px;
      background: radial-gradient(circle at 35% 30%, #fff, #b2b3b7 48%, #777a80);
      border: 1px solid #94969b;
      border-radius: 50%;
    }
    .view-switcher { display: grid; grid-template-columns: repeat(3, minmax(86px, 1fr)); gap: 8px; }
    .view-switcher button {
      min-height: 40px;
      padding: 0 18px;
      color: #755367;
      background: rgba(255, 255, 255, .92);
      border: 1px solid #aa7f90;
      border-radius: 4px;
      box-shadow: 3px 3px 0 #ead7df;
      font-weight: 800;
      cursor: pointer;
    }
    .view-switcher button[aria-selected="true"] {
      color: #59404e;
      background: #f3c9d9;
      border-color: #9f7285;
      box-shadow: 3px 3px 0 #d5a9ba;
      font-weight: 900;
    }
    .shell { width: min(1080px, 100%); margin: 0 auto; padding: 24px; }
    .capture-card {
      position: relative;
      overflow: hidden;
      width: 100%;
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: 0 14px 34px rgba(23, 24, 28, .12);
    }
    .capture-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 10px;
      background: var(--xinyi-pink);
    }
    .schedule-capture {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }
    .schedule-capture::before { display: none; }
    .schedule-card {
      --z-deep: #3f3e56;
      --z-muted: #858296;
      --z-line: rgba(79, 75, 108, .14);
      --z-row: rgba(255, 255, 255, .7);
      --z-a: #f26f82;
      --z-b: #8d67ce;
      --z-c: #47c9b5;
      --z-d: #f2ce63;
      position: relative;
      z-index: 1;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      color: var(--z-deep);
      background: linear-gradient(140deg, #fff8fb, #fff 38%, #f0fbf9 66%, #f7f3ff 100%);
      border: 0;
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(80, 74, 123, .14);
    }
    .schedule-card::before {
      content: "";
      position: absolute;
      z-index: 5;
      inset: 0 auto 0 0;
      width: 22px;
      background: linear-gradient(180deg, var(--z-b), var(--z-a) 34%, var(--z-d) 67%, var(--z-c));
    }
    .schedule-card::after { display: none; }
    .schedule-rail {
      position: absolute;
      z-index: 6;
      top: 28px;
      bottom: 28px;
      left: 2px;
      width: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, .92);
      font: 800 10px/1.45 "Segoe UI", sans-serif;
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }
    .schedule-glow {
      position: absolute;
      z-index: 0;
      display: block;
      pointer-events: none;
      filter: blur(78px);
      opacity: .24;
      transform: rotate(-8deg);
    }
    .schedule-glow-a { top: 68px; right: -8%; width: 68%; height: 210px; background: linear-gradient(90deg, var(--z-a), var(--z-b)); }
    .schedule-glow-b { top: 43%; left: -10%; width: 75%; height: 250px; background: linear-gradient(90deg, var(--z-c), var(--z-d), var(--z-a)); opacity: .17; transform: rotate(8deg); }
    .schedule-glow-c { right: -14%; bottom: 120px; width: 72%; height: 220px; background: linear-gradient(90deg, var(--z-b), var(--z-c)); opacity: .18; }
    .masthead {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 30px;
      align-items: end;
      padding: 60px 58px 42px;
      border-bottom: 1px solid var(--line);
    }
    .schedule-card .masthead {
      position: relative;
      z-index: 2;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 30px;
      align-items: start;
      padding: 62px 58px 38px 76px;
      color: var(--z-deep);
      background: transparent;
      border-bottom: 0;
    }
    .schedule-eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      color: #77728d;
      font: 800 13px/1.4 "Segoe UI", sans-serif;
      font-weight: 900;
    }
    .schedule-eyebrow::before { content: ""; width: 28px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--z-a), var(--z-b)); }
    .xinyi-mark { display: none; }
    .masthead h1 { margin: 0; font-size: 64px; line-height: 1.08; font-weight: 900; }
    .schedule-card .masthead h1 {
      display: block;
      color: transparent;
      background: linear-gradient(145deg, #e65d8b, #7a67d7 70%, #47c9b5);
      background-clip: text;
      -webkit-background-clip: text;
      box-shadow: none;
      font-size: 72px;
      font-weight: 950;
    }
    .schedule-card .masthead-copy { max-width: 650px; margin-top: 20px; color: #7e7b91; }
    .masthead-copy { margin: 16px 0 0; color: var(--muted); font-size: 20px; line-height: 1.7; }
    .signal-block { min-width: 194px; padding-left: 24px; border-left: 6px solid var(--cyan); }
    .schedule-card .signal-block {
      min-width: 208px;
      padding: 23px 24px;
      color: #4b456a;
      background: rgba(255, 255, 255, .84);
      border: 0;
      border-radius: 10px 28px 10px 28px;
      box-shadow: 0 14px 36px rgba(87, 76, 126, .12);
      backdrop-filter: blur(16px);
      transform: none;
    }
    .schedule-card .signal-block::before { display: none; }
    .schedule-card .signal-value { color: var(--z-deep); }
    .schedule-card .signal-label { color: #7d7990; font-weight: 700; }
    .schedule-card .masthead::after { display: none; }
    .signal-value { display: block; font-size: 50px; line-height: 1; font-weight: 900; }
    .signal-label { display: block; margin-top: 10px; color: var(--muted); font-size: 17px; }
    .schedule-body { padding: 10px 58px 42px; }
    .schedule-card .schedule-body { position: relative; z-index: 2; padding: 6px 58px 18px 76px; background: transparent; }
    .day-section { display: grid; grid-template-columns: 176px 1fr; border-bottom: 1px solid var(--line); }
    .schedule-card .day-section {
      grid-template-columns: 140px minmax(0, 1fr);
      margin: 18px 0 28px;
      padding: 20px 22px;
      background: rgba(255, 255, 255, .72);
      border-top: 0;
      border-bottom: 0;
      border-radius: 12px 30px 12px 30px;
      box-shadow: 0 16px 42px rgba(87, 76, 126, .1);
      backdrop-filter: blur(18px);
    }
    .day-section:last-child { border-bottom: 0; }
    .day-heading { padding: 34px 24px 34px 0; }
    .schedule-card .day-heading { position: relative; padding: 22px 24px 22px 2px; }
    .day-date { display: block; font-size: 31px; font-weight: 900; }
    .schedule-card .day-date { color: #4a4763; }
    .schedule-card .date-month,
    .schedule-card .date-day { display: block; white-space: nowrap; }
    .day-weekday { display: block; margin-top: 8px; color: var(--muted); font-size: 18px; }
    .schedule-card .day-weekday { color: var(--z-muted); }
    .schedule-card .day-heading::after { content: ""; position: absolute; left: 2px; bottom: 16px; width: 38px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--z-a), var(--z-b)); }
    .day-list { min-width: 0; padding: 20px 0 20px 32px; border-left: 1px solid var(--line); }
    .schedule-card .day-list { padding: 4px 0 4px 20px; border-left: 1px solid rgba(105, 96, 145, .13); }
    .schedule-row {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr) auto;
      gap: 22px;
      align-items: center;
      padding: 18px 0;
    }
    .schedule-card .schedule-row {
      position: relative;
      margin: 8px 0;
      padding: 17px 18px;
      background: linear-gradient(90deg, rgba(255, 255, 255, .96), rgba(255, 221, 233, .5), rgba(218, 240, 237, .42));
      border: 0;
      border-radius: 10px;
      box-shadow: none;
    }
    .schedule-card .schedule-row:nth-child(2) { transform: none; }
    .schedule-row + .schedule-row { border-top: 0; }
    .schedule-time { font-size: 31px; line-height: 1.2; font-weight: 900; font-variant-numeric: tabular-nums; }
    .schedule-card .schedule-time {
      align-self: center;
      padding: 12px 8px;
      color: #4a4763;
      background: rgba(255, 255, 255, .88);
      border: 1px solid rgba(92, 88, 121, .14);
      border-radius: 8px;
      box-shadow: none;
      text-align: center;
    }
    .schedule-content { min-width: 0; }
    .schedule-card .schedule-title { font-size: 21px; line-height: 1.35; overflow-wrap: anywhere; word-break: normal; }
    .schedule-hosts { margin-top: 7px; color: var(--muted); font-size: 17px; line-height: 1.5; }
    .schedule-card .schedule-hosts { color: var(--z-muted); }
    .schedule-meta { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
    .schedule-sticker {
      display: block;
      align-self: center;
      width: 118px;
      height: 96px;
      object-fit: contain;
    }
    .schedule-label {
      align-self: center;
      min-width: 82px;
      padding: 8px 12px;
      text-align: center;
      color: #2c3035;
      background: var(--soft);
      border-left: 4px solid var(--pink);
      font-size: 16px;
      font-weight: 800;
    }
    .schedule-card .schedule-label {
      position: relative;
      color: #5b527e;
      background: linear-gradient(90deg, rgba(255, 216, 229, .82), rgba(210, 240, 236, .78));
      border: 0;
      border-radius: 999px;
      box-shadow: none;
    }
    .schedule-card .schedule-label::before,
    .schedule-card .schedule-label::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 5px;
      height: 5px;
      display: none;
      border-radius: 50%;
      transform: translateY(-50%);
    }
    .schedule-card .schedule-label::before { left: 5px; }
    .schedule-card .schedule-label::after { right: 5px; }
    .schedule-row.highlight-pink { background: linear-gradient(90deg, #fff, rgba(255, 210, 226, .78)); }
    .schedule-row.highlight-red { background: linear-gradient(90deg, #fff, rgba(255, 203, 211, .76)); }
    .schedule-row.highlight-gold { background: linear-gradient(90deg, #fff, rgba(242, 218, 149, .58)); }
    .schedule-card .schedule-row::after { display: none; }
    .empty-day { padding: 30px 0; color: var(--muted); font-size: 19px; }
    .schedule-card .empty-day { color: var(--z-muted); }
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 24px 58px 28px;
      color: #70727a;
      background: #f6f7f9;
      border-top: 1px solid var(--line);
      font-size: 15px;
    }
    .schedule-card .footer {
      position: relative;
      z-index: 2;
      padding: 20px 58px 25px 76px;
      color: #898698;
      background: transparent;
      border-top: 0;
      font-size: 12px;
    }
    .schedule-card .footer strong { color: #625d79; }
    .loading, .error { padding: 110px 40px; text-align: center; font-size: 22px; }
    .error { color: var(--red); }
    .notification { padding: 0 58px 46px; }
    .notification-card {
      --notice-a: #f26f82;
      --notice-b: #8d67ce;
      --notice-c: #47c9b5;
      --notice-d: #f2ce63;
      --notice-deep: #3f3e56;
      --notice-muted: #858296;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }
    .notification-card.video { --notice-a: #8d67ce; --notice-b: #4a9fd1; --notice-c: #47c9b5; --notice-d: #f2ce63; }
    .notification-card.live-start { --notice-a: #f26f82; --notice-b: #ff796f; --notice-c: #8d67ce; --notice-d: #f2ce63; }
    .notification-card.live-end { --notice-a: #8d67ce; --notice-b: #6d82d7; --notice-c: #47c9b5; --notice-d: #f0b8ca; }
    .notification-card::before { display: none; }
    .notification-surface {
      position: relative;
      z-index: 1;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      color: var(--notice-deep);
      background: linear-gradient(140deg, #fff8fb, #fff 38%, #f0fbf9 66%, #f7f3ff 100%);
      border: 0;
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(80, 74, 123, .14);
    }
    .notification-surface::before {
      content: "";
      position: absolute;
      z-index: 5;
      inset: 0 auto 0 0;
      width: 22px;
      background: linear-gradient(180deg, var(--notice-b), var(--notice-a) 34%, var(--notice-d) 67%, var(--notice-c));
    }
    .notification-rail {
      position: absolute;
      z-index: 6;
      top: 28px;
      bottom: 28px;
      left: 2px;
      width: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, .92);
      font: 800 10px/1.45 "Segoe UI", sans-serif;
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }
    .notification-glow {
      position: absolute;
      z-index: 0;
      display: block;
      pointer-events: none;
      filter: blur(78px);
      opacity: .24;
      transform: rotate(-8deg);
    }
    .notification-glow-a { top: 58px; right: -8%; width: 68%; height: 210px; background: linear-gradient(90deg, var(--notice-a), var(--notice-b)); }
    .notification-glow-b { top: 43%; left: -10%; width: 75%; height: 250px; background: linear-gradient(90deg, var(--notice-c), var(--notice-d), var(--notice-a)); opacity: .17; transform: rotate(8deg); }
    .notification-glow-c { right: -14%; bottom: 92px; width: 72%; height: 220px; background: linear-gradient(90deg, var(--notice-b), var(--notice-c)); opacity: .18; }
    .notification-card .notification {
      position: relative;
      z-index: 2;
      padding: 0 58px 44px 76px;
      background: transparent;
    }
    .creator {
      display: grid;
      grid-template-columns: 112px 1fr auto;
      gap: 24px;
      align-items: center;
      padding: 54px 0 32px;
      border-bottom: 1px solid var(--line);
    }
    .notification-card .creator {
      position: relative;
      grid-template-columns: 108px minmax(0, 1fr) 154px;
      gap: 22px;
      margin: 0;
      padding: 52px 0 34px;
      background: transparent;
      border-bottom: 0;
    }
    .notification-card .creator::after { display: none; }
    .avatar {
      width: 112px;
      height: 112px;
      object-fit: cover;
      background: var(--soft);
      border: 2px solid var(--ink);
      border-radius: 50%;
    }
    .notification-card .avatar {
      width: 104px;
      height: 104px;
      padding: 4px;
      background: linear-gradient(135deg, var(--notice-d), var(--notice-a), var(--notice-b), var(--notice-c));
      border: 0;
      box-shadow: 0 12px 30px rgba(91, 78, 130, .14);
    }
    .notification-card img.avatar { object-fit: cover; border: 4px solid #fff; }
    .creator-copy { min-width: 0; }
    .notification-kicker { margin: 0 0 10px; color: #77728d; font: 800 12px/1.4 "Segoe UI", sans-serif; }
    .creator-heading { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
    .creator-name { margin: 0; font-size: 38px; line-height: 1.2; font-weight: 900; }
    .notification-card .creator-name {
      position: relative;
      z-index: 1;
      display: block;
      color: transparent;
      background: linear-gradient(145deg, var(--notice-a), var(--notice-b) 62%, var(--notice-c));
      background-clip: text;
      -webkit-background-clip: text;
      box-shadow: none;
      font-size: 48px;
      font-weight: 950;
    }
    .creator-profile { margin: 9px 0 0; color: var(--muted); font-size: 17px; line-height: 1.55; }
    .notification-card .creator-profile { position: relative; z-index: 1; color: var(--notice-muted); }
    .notification-kind {
      padding: 11px 16px;
      color: var(--ink);
      background: var(--lime);
      border: 2px solid var(--ink);
      border-radius: 4px;
      font-size: 17px;
      font-weight: 900;
    }
    .notification-card .notification-kind {
      position: relative;
      z-index: 1;
      padding: 9px 14px;
      color: #5b527e;
      background: linear-gradient(90deg, rgba(255, 216, 229, .78), rgba(210, 240, 236, .74));
      border: 0;
      border-radius: 999px;
      box-shadow: none;
      font-size: 14px;
    }
    .mode-seal { align-self: start; padding-top: 4px; text-align: right; }
    .mode-seal span { display: block; color: rgba(84, 82, 130, .105); font: italic 950 62px/.78 "Segoe UI", sans-serif; transform: skewX(-5deg); }
    .mode-seal em { display: block; margin-top: 12px; color: #77728d; font: 850 12px/1.2 "Segoe UI", sans-serif; font-style: normal; }
    .notification-title { margin: 38px 0 22px; font-size: 45px; line-height: 1.34; font-weight: 900; word-break: break-word; }
    .notification-card .notification-title {
      position: relative;
      margin: 8px 0 24px;
      padding-left: 20px;
      color: #49455f;
    }
    .notification-card .notification-title::before {
      content: "";
      position: absolute;
      top: .15em;
      bottom: .15em;
      left: 0;
      width: 6px;
      border-radius: 6px;
      background: linear-gradient(180deg, var(--notice-a), var(--notice-b), var(--notice-c));
    }
    .notification-text { margin: 0 0 26px; color: #555269; font-size: 23px; line-height: 1.72; white-space: pre-wrap; word-break: break-word; }
    .inline-emoji { display: inline-block; width: 1.5em; height: 1.5em; margin: 0 .05em; vertical-align: -.32em; object-fit: contain; }
    .media-frame { overflow: hidden; margin: 24px 0; background: rgba(255, 255, 255, .72); border: 0; border-radius: 12px 30px 12px 30px; }
    .notification-card .media-frame,
    .notification-card .quote,
    .notification-card .reservation,
    .notification-card .stats {
      background: rgba(255, 255, 255, .72);
      border: 0;
      box-shadow: 0 16px 42px rgba(87, 76, 126, .1);
      backdrop-filter: blur(18px);
    }
    .media-frame img { display: block; width: 100%; height: auto; }
    .media-fallback { display: grid; min-height: 360px; place-items: center; color: #746b91; background: linear-gradient(135deg, rgba(255, 223, 234, .76), rgba(225, 217, 248, .62), rgba(199, 239, 234, .7)); font-size: 24px; font-weight: 850; }
    .notification-card .media-fallback { background: linear-gradient(135deg, rgba(255, 223, 234, .76), rgba(225, 217, 248, .62), rgba(199, 239, 234, .7)); }
    .image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 24px 0; }
    .image-grid.single { grid-template-columns: 1fr; }
    .image-grid img { display: block; width: 100%; height: auto; overflow: hidden; background: #fff; border: 0; border-radius: 12px; box-shadow: 0 12px 30px rgba(87, 76, 126, .09); }
    .quote { margin: 28px 0; padding: 26px 30px; background: #f3f4f6; border-left: 8px solid var(--cyan); }
    .notification-card .quote { background: linear-gradient(90deg, rgba(255, 255, 255, .9), rgba(199, 239, 234, .58)); border-left: 8px solid var(--notice-c); border-radius: 10px 28px 10px 28px; }
    .quote strong { display: block; margin-bottom: 10px; font-size: 19px; }
    .quote p { margin: 0; font-size: 19px; line-height: 1.65; white-space: pre-wrap; }
    .quote .image-grid { margin: 20px 0 0; }
    .reservation {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: center;
      margin: 28px 0;
      padding: 24px 28px;
      background: linear-gradient(90deg, rgba(255, 255, 255, .92), rgba(255, 218, 231, .62), rgba(229, 220, 249, .56));
      border: 0;
      border-left: 8px solid var(--notice-a);
      border-radius: 10px 28px 10px 28px;
    }
    .notification-card .reservation { background: linear-gradient(90deg, rgba(255, 255, 255, .92), rgba(255, 218, 231, .62), rgba(229, 220, 249, .56)); }
    .reservation-label { color: #786092; font-size: 15px; font-weight: 800; }
    .reservation-title { margin-top: 7px; font-size: 22px; line-height: 1.45; font-weight: 900; word-break: break-word; }
    .reservation-subtitle { margin-top: 5px; color: var(--muted); font-size: 17px; line-height: 1.5; }
    .reservation-action {
      min-width: 88px;
      padding: 10px 16px;
      color: #fff;
      background: linear-gradient(135deg, var(--notice-a), var(--notice-b) 58%, var(--notice-c));
      border: 0;
      border-radius: 999px;
      text-align: center;
      font-size: 17px;
      font-weight: 900;
    }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 32px; background: rgba(255, 255, 255, .72); border: 0; border-radius: 12px 30px 12px 30px; }
    .stat { padding: 22px; }
    .stat + .stat { border-left: 1px solid rgba(105, 96, 145, .13); }
    .stat span { display: block; color: var(--notice-muted); font-size: 15px; }
    .stat strong { display: block; margin-top: 8px; color: #4a4763; font-size: 29px; }
    .live-start .notification-kind { color: #fff; background: var(--red); }
    .live-end .notification-kind { background: #cfd2d9; }
    .notification-card.dynamic .notification-kind,
    .notification-card.video .notification-kind,
    .notification-card.live-start .notification-kind,
    .notification-card.live-end .notification-kind { color: #5b527e; background: linear-gradient(90deg, rgba(255, 216, 229, .78), rgba(210, 240, 236, .74)); }
    .notification-card .footer {
      position: relative;
      z-index: 2;
      padding: 20px 58px 25px 76px;
      color: #898698;
      background: transparent;
      border-top: 0;
    }
    .notification-card .footer strong { color: #625d79; }
    .capture-mode { background: transparent; }
    .capture-mode .interactive-bar { display: none !important; }
    .capture-mode .shell { width: 1080px; margin: 0; padding: 0; }

    @media (max-width: 720px) {
      .interactive-bar { align-items: stretch; flex-direction: column; gap: 12px; }
      .interactive-brand { text-align: center; }
      .view-switcher button { min-height: 44px; padding-inline: 10px; }

      .masthead { grid-template-columns: 1fr; padding: 46px 24px 30px; }
      .schedule-card { border-radius: 22px; }

      .schedule-rail { left: 0; width: 13px; font-size: 7px; }
      .schedule-card .masthead { grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 40px 20px 25px 39px; }
      .schedule-card .signal-block { grid-column: 1 / -1; }

      .schedule-card .masthead h1 { font-size: 48px; }
      .schedule-eyebrow { margin-bottom: 12px; font-size: 10px; }

      .signal-block { display: flex; align-items: baseline; gap: 10px; padding-left: 14px; }
      .schedule-card .signal-block { min-width: 0; padding: 16px 18px; }

      .schedule-card .date-day { display: inline; }

      .schedule-row { grid-template-columns: 72px minmax(0, 1fr); gap: 12px; }

      .notification-card .creator { grid-template-columns: 78px minmax(0, 1fr); gap: 16px; margin: 0; padding: 36px 0 28px; }
      .creator { grid-template-columns: 78px minmax(0, 1fr); gap: 16px; }

      .mode-seal { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; width: 100%; padding: 0; text-align: left; }

      .mode-seal em { margin: 0; }

    @media (max-width: 420px) {
      .schedule-card .masthead h1 { font-size: 42px; }
      .schedule-card .masthead-copy { font-size: 16px; }

      .schedule-time { font-size: 20px; }

      .schedule-label { min-width: 64px; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }

<body class="__ASOUL_CAPTURE_CLASS__">
  <div class="page">
    <header class="interactive-bar">
      <div class="interactive-brand">枝江直播日历</div>
      <div class="view-switcher" role="tablist" aria-label="直播日历范围">
        <button type="button" role="tab" data-view="today">今日</button>
        <button type="button" role="tab" data-view="tomorrow">明日</button>
        <button type="button" role="tab" data-view="week">本周</button>
      </div>
    </header>
    <main class="shell"><article id="capture-root" class="capture-card"><div class="loading">正在整理直播日历…</div></article></main>
  </div>
  <script>
  (() => {
    const embeddedPayload = __ASOUL_PAYLOAD_JSON__;
    const root = document.querySelector("#capture-root");
    const labels = { today: "今日直播", tomorrow: "明日直播", week: "本周直播" };
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const safeUrl = (value) => /^(https:\/\/|data:image\/)/.test(String(value || "")) ? String(value) : "";
    const splitUrls = (value) => {
      if (Array.isArray(value)) return value.filter((item) => safeUrl(item));
      try { const parsed = JSON.parse(String(value || "[]")); return Array.isArray(parsed) ? parsed.filter((item) => safeUrl(item)) : []; }
      catch { return String(value || "").split("|").filter((item) => safeUrl(item)); }
    };
    const image = (url, className = "") => safeUrl(url) ? `<img class="${className}" src="${escapeHtml(url)}" alt="" referrerpolicy="no-referrer">` : "";
    const highlightClass = (style) => style === "粉色" ? "highlight-pink" : style === "红色" ? "highlight-red" : style === "白金色" ? "highlight-gold" : "";
    const scheduleDate = (value) => {
      const match = String(value || "").match(/^(\d{2}月)(\d{2}日)$/);
      return match
        ? `<span class="day-date"><span class="date-month">${match[1]}</span><span class="date-day">${match[2]}</span></span>`
        : `<span class="day-date">${escapeHtml(value)}</span>`;
    };
    function renderSchedule(payload) {
      const days = payload.days || [];
      root.className = "capture-card schedule-capture";
      root.innerHTML = `
        <article class="schedule-card">
        <span class="schedule-rail">AK-BOT FUNCTION</span>
        <i class="schedule-glow schedule-glow-a" aria-hidden="true"></i>
        <i class="schedule-glow schedule-glow-b" aria-hidden="true"></i>
        <i class="schedule-glow schedule-glow-c" aria-hidden="true"></i>
        <section class="masthead">
          <div><div class="schedule-eyebrow"><span class="xinyi-mark" aria-hidden="true"></span><span>AK-BOT FUNCTION</span></div><h1>${escapeHtml(payload.title || labels[payload.view] || "直播日历")}</h1><p class="masthead-copy">从开播时间到节目内容，一眼找到值得等候的那一场。</p></div>
          <div class="signal-block"><span class="signal-value">${Number(payload.event_count || 0)}</span><span class="signal-label">场直播安排</span></div>
        </section>
        <div class="schedule-body">${days.map((day) => `
          <section class="day-section">
            <header class="day-heading">${scheduleDate(day.date_label)}<span class="day-weekday">${escapeHtml(day.weekday)}</span></header>
            <div class="day-list">${day.items?.length ? day.items.map((item) => `
              <article class="schedule-row ${item.highlighted ? highlightClass(item.highlight_style) : ""}">
                <time class="schedule-time">${escapeHtml(item.time)}</time>
                <div class="schedule-content"><div class="schedule-title">${escapeHtml(item.content)}</div><div class="schedule-hosts">${escapeHtml(item.hosts?.join(" / ") || "出演成员待确认")}${item.highlighted ? ` · 特别关注 ${escapeHtml(item.highlight_style)}` : ""}</div></div>
                <div class="schedule-meta">${image(item.sticker_url, "schedule-sticker")}<span class="schedule-label">${escapeHtml(item.label || "直播")}</span></div>
              </article>`).join("") : `<div class="empty-day">当天暂时没有公开直播安排。</div>`}</div>
          </section>`).join("")}</div>
        <footer class="footer"><span>枝江日历功能由爱驼提供技术支持</span><strong>AK bot · Generated by Secmon</strong></footer>
        </article>`;
    }
    function notificationKind(mode) {
      return { dynamic: "最新动态", video: "最新视频", "live-start": "正在直播", "live-end": "直播已结束" }[mode] || "B站通知";
    }
    function notificationModeCode(mode) {
      return { dynamic: "DYNAMIC", video: "VIDEO", "live-start": "LIVE", "live-end": "REPLAY" }[mode] || "NOTICE";
    }
    function richNodes(value, fallback = "") {
      try {
        const nodes = JSON.parse(String(value || "[]"));
        if (!Array.isArray(nodes) || !nodes.length) return escapeHtml(fallback);
        return nodes.map((node) => {
          const text = escapeHtml(node?.text || "");
          return node?.type === "emoji" ? (image(node.url, "inline-emoji") || text) : text;
        }).join("");
      } catch { return escapeHtml(fallback); }
    }
    function renderNotification(payload) {
      const d = payload.details || {};
      const mode = payload.mode || "dynamic";
      document.title = `${notificationKind(mode)} · 枝江 B站推送`;
      const title = mode === "dynamic" ? (d.title || "发布了一条新动态") : (d.text || d.title || "新内容已发布");
      const pictures = mode === "dynamic" ? splitUrls(d.image_urls) : [];
      const quotePictures = mode === "dynamic" ? splitUrls(d.quote_image_urls) : [];
      const cover = mode === "video" || mode.startsWith("live-") ? safeUrl(d.cover_url) : "";
      const profileStats = mode === "live-end"
        ? [["直播时长", d.live_duration || "未完整观测"], ["人气峰值", d.popularity_peak || "--"], ["人气均值", d.popularity_average || "--"]]
        : [["获赞", d.likes || "--"], ["关注", d.following || "--"], ["粉丝", d.followers || "--"]];
      const modeCode = notificationModeCode(mode);
      root.className = `capture-card notification-card ${escapeHtml(mode)}`;
      root.innerHTML = `<article class="notification-surface"><span class="notification-rail">AK-BOT FUNCTION</span><i class="notification-glow notification-glow-a" aria-hidden="true"></i><i class="notification-glow notification-glow-b" aria-hidden="true"></i><i class="notification-glow notification-glow-c" aria-hidden="true"></i><div class="notification">
        <header class="creator">${image(d.avatar_url, "avatar") || `<div class="avatar"></div>`}<div class="creator-copy"><p class="notification-kicker">AK-BOT FUNCTION</p><div class="creator-heading"><h1 class="creator-name">${escapeHtml(d.author || "B站UP主")}</h1><span class="notification-kind">${notificationKind(mode)}</span></div><p class="creator-profile">${escapeHtml(d.profile || "来自 Bilibili 的最新信号")}</p></div><div class="mode-seal" aria-label="Bilibili ${modeCode}"><span>BILI</span><em>${modeCode}</em></div></header>
        <h2 class="notification-title">${escapeHtml(title)}</h2>
        ${mode === "dynamic" ? `<p class="notification-text">${richNodes(d.rich_nodes, d.text)}</p>` : ""}
        ${cover ? `<div class="media-frame">${image(cover)}</div>` : mode !== "dynamic" ? `<div class="media-frame media-fallback">Bilibili ${mode.startsWith("live-") ? "Live" : "Video"}</div>` : ""}
        ${pictures.length ? `<div class="image-grid ${pictures.length === 1 ? "single" : ""}">${pictures.map((url) => image(url)).join("")}</div>` : ""}
        ${d.quote_text || d.quote_author || quotePictures.length ? `<blockquote class="quote"><strong>${escapeHtml(d.quote_author || "转发内容")}</strong>${d.quote_text ? `<p>${richNodes(d.quote_rich_nodes, d.quote_text)}</p>` : ""}${quotePictures.length ? `<div class="image-grid ${quotePictures.length === 1 ? "single" : ""}">${quotePictures.map((url) => image(url)).join("")}</div>` : ""}</blockquote>` : ""}
        ${d.reserve_title || d.reserve_subtitle ? `<section class="reservation"><div><div class="reservation-label">直播预约</div>${d.reserve_title ? `<div class="reservation-title">${escapeHtml(d.reserve_title)}</div>` : ""}${d.reserve_subtitle ? `<div class="reservation-subtitle">${escapeHtml(d.reserve_subtitle)}</div>` : ""}</div><span class="reservation-action">${escapeHtml(d.reserve_action || "预约")}</span></section>` : ""}
        ${mode === "video" && d.description ? `<p class="notification-text">${escapeHtml(d.description)}</p>` : ""}
        <div class="stats">${profileStats.map(([label, value]) => `<div class="stat"><span>${label}</span><strong>${escapeHtml(value)}</strong></div>`).join("")}</div>
      </div><footer class="footer"><span>本功能由爱托提供技术支持</span><strong>AK bot · Generated by Secmon</strong></footer></article>`;
    }
    function render(payload) { payload?.mode === "schedule" ? renderSchedule(payload) : renderNotification(payload || {}); }
    function selectedView() {
      const value = new URLSearchParams(location.search).get("view");
      return ["today", "tomorrow", "week"].includes(value) ? value : "today";
    }
    function updateTabs(view) { document.querySelectorAll("[data-view]").forEach((button) => button.setAttribute("aria-selected", String(button.dataset.view === view))); }
    async function loadView(view, replaceHistory = false) {
      updateTabs(view);
      root.innerHTML = `<div class="loading">正在整理${labels[view]}…</div>`;
      const apiBase = location.pathname.startsWith("/live") ? "/live/api" : "/asoul-live/api";
      try {
        const response = await fetch(`${apiBase}/schedule?view=${encodeURIComponent(view)}`, { headers: { Accept: "application/json" } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
        const next = new URL(location.href); next.searchParams.set("view", view); history[replaceHistory ? "replaceState" : "pushState"]({}, "", next);
        document.title = `${labels[view]} · 枝江直播日历`;
      } catch { root.innerHTML = `<div class="error">直播日历暂时无法读取，请稍后刷新。</div>`; }
    }
    document.querySelectorAll("[data-view]").forEach((button) => button.addEventListener("click", () => loadView(button.dataset.view)));
    window.addEventListener("popstate", () => loadView(selectedView(), true));
    if (embeddedPayload) { render(embeddedPayload); updateTabs(embeddedPayload.view || "today"); }
    else { loadView(selectedView(), true); }
  })();
  </script>
</body>
