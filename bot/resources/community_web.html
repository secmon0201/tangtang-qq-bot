<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>社区功能 · 糖糖</title>
  <style>
    :root{--paper:#fffdfd;--pink:#f9dfe9;--stripe:#efd0dd;--line:#aa7f90;--deep:#755367;--muted:#866f7b;--shadow:#ead7df;--row:#d7b6c3;--metal:#d2d6dc;--ink:#493b43}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff3f7;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;letter-spacing:0}.page{min-height:100vh}
    .interactive-bar{position:sticky;top:0;z-index:10;display:grid;gap:12px;padding:14px max(20px,calc((100vw - 1080px)/2));background:#f7e4ec;border-bottom:2px solid var(--line)}.interactive-brand{color:var(--deep);font-size:17px;font-weight:900}.control-row{display:flex;gap:8px;flex-wrap:wrap}.control-row button{min-height:38px;padding:0 15px;color:var(--deep);background:#fff;border:1px solid var(--line);border-radius:4px;font:700 14px "Microsoft YaHei",sans-serif;cursor:pointer}.control-row button[aria-selected="true"]{background:var(--pink);box-shadow:3px 3px 0 var(--shadow)}
    .shell{width:min(1080px,100%);margin:0 auto;padding:24px}.capture{position:relative;isolation:isolate;overflow:hidden;padding:0 12px 12px 0;background:linear-gradient(to bottom,#ead7df 0%,#d2d6dc 100%)}.community-card{position:relative;z-index:1;overflow:hidden;background:var(--paper);border:2px solid var(--line)}
    .masthead{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:center;padding:48px 58px 31px;background:repeating-linear-gradient(135deg,var(--pink) 0 16px,var(--stripe) 16px 18px);border-bottom:2px solid var(--line)}.masthead::after{content:"";position:absolute;z-index:3;top:27px;right:52px;width:42px;height:72px;border:5px solid #b2b5ba;border-left-width:3px;border-radius:24px 24px 18px 18px;box-shadow:inset 0 0 0 1px #fff;transform:rotate(14deg)}.brandline{display:flex;align-items:center;gap:12px;margin-bottom:16px;color:var(--deep);font-size:16px;font-weight:900}.face-mark{position:relative;display:block;width:52px;height:52px;color:#fffafd;background:var(--deep);border-radius:50%;box-shadow:-5px 5px 0 #d5a9ba;transform:rotate(-7deg)}.face-mark::before{content:"×  ×";position:absolute;inset:8px 0 auto;text-align:center;font-size:20px;line-height:1;font-weight:900}.face-mark::after{content:"⌣";position:absolute;inset:24px 0 auto;text-align:center;font-size:22px;line-height:1;font-weight:900}h1{display:inline;margin:0;color:#44363f;background:rgba(255,255,255,.88);box-shadow:9px 9px 0 var(--shadow);font-size:54px;line-height:1.12;font-weight:900}.masthead p{margin:27px 0 0;color:var(--muted);font-size:18px;line-height:1.55}.signal{position:relative;min-width:190px;padding:19px 22px;color:var(--deep);background:rgba(255,255,255,.94);border:2px solid var(--line);box-shadow:7px 7px 0 var(--shadow);transform:rotate(1.4deg)}.signal::before{content:"";position:absolute;top:9px;right:9px;width:10px;height:10px;background:radial-gradient(circle at 35% 30%,#fff,#aeb1b8 48%,#737781);border:1px solid #8d9098;border-radius:50%}.signal strong{display:block;font-size:42px;line-height:1}.signal span{display:block;margin-top:8px;color:var(--muted);font-size:15px}
    .content{padding:0 58px}.ranking-list{margin:0;padding:18px 0;list-style:none}.ranking-row{position:relative;display:grid;grid-template-columns:68px 64px minmax(0,1fr) auto;gap:16px;align-items:center;margin:10px 0;padding:13px 22px;background:#fff;border:2px solid var(--row);box-shadow:7px 7px 0 var(--shadow)}.ranking-row:nth-child(2n){transform:rotate(-.2deg)}.ranking-row::after{content:"";position:absolute;right:9px;bottom:9px;width:9px;height:9px;background:radial-gradient(circle at 35% 30%,#fff,#b2b3b7 48%,#777a80);border:1px solid #94969b;border-radius:50%}.rank{display:grid;width:54px;height:54px;place-items:center;color:var(--deep);background:#fff;border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);font-size:24px;font-weight:900}.avatar{display:grid;width:58px;height:58px;place-items:center;overflow:hidden;color:#fff;background:var(--deep);border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px var(--row),4px 4px 0 var(--shadow);font-size:18px;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.person{min-width:0}.person strong{display:block;overflow-wrap:anywhere;font-size:20px;line-height:1.35}.person span{display:block;margin-top:4px;color:var(--muted);font-size:14px}.count{min-width:94px;padding:9px 12px;text-align:center;color:var(--deep);background:#f4e4ea;border:1px solid var(--line);border-radius:8px 3px 8px 4px;box-shadow:3px 3px 0 var(--shadow);font-size:17px;font-weight:900}
    .chart-section{margin:14px 0 34px;padding:24px 24px 20px;background:#fff;border:2px solid var(--row);box-shadow:7px 7px 0 var(--shadow)}.chart-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:8px}.chart-heading h2{margin:0;color:var(--deep);font-size:24px}.chart-heading p{margin:0;color:var(--muted);font-size:14px}.chart-plot{display:block;width:100%;height:auto;overflow:visible}.chart-grid{stroke:#ead7df;stroke-width:1}.chart-axis{stroke:#b98fa0;stroke-width:1.5}.chart-line{fill:none;stroke:#bf6688;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.chart-point{fill:#bf6688;stroke:#fff;stroke-width:4}.chart-value{fill:#755367;font:700 15px "Microsoft YaHei",sans-serif;text-anchor:middle}.chart-scale{fill:#9a7b89;font:13px "Microsoft YaHei",sans-serif;text-anchor:end}.chart-labels{display:grid;align-items:start;gap:4px;margin:0 28px 0 72px}.chart-label{min-width:0;text-align:center}.chart-label .avatar{width:42px;height:42px;margin:0 auto 8px;font-size:13px;box-shadow:0 0 0 2px var(--row)}.chart-label strong{display:block;overflow-wrap:anywhere;color:var(--muted);font-size:13px;line-height:1.35}
    .empty{padding:62px 0;color:var(--muted);text-align:center;font-size:18px}.help-list{display:grid;gap:13px;padding:20px 0 28px}.help-item{position:relative;padding:16px 20px;background:#fff;border:2px solid var(--row);box-shadow:7px 7px 0 var(--shadow)}.help-item::after{content:"";position:absolute;right:9px;bottom:9px;width:9px;height:9px;background:radial-gradient(circle at 35% 30%,#fff,#b2b3b7 48%,#777a80);border:1px solid #94969b;border-radius:50%}.help-item h2{margin:0;color:var(--deep);font-size:20px}.help-command{margin:8px 0 6px;color:#44363f;white-space:pre-wrap;overflow-wrap:anywhere;font-family:Consolas,"Microsoft YaHei",monospace;font-size:15px;font-weight:700;line-height:1.55}.help-item p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}.section-note{margin:0;padding:17px 0 0;color:var(--muted);font-size:15px}.footer{display:flex;justify-content:space-between;gap:20px;padding:21px 58px 24px;color:#6b7079;background:linear-gradient(105deg,#f4f5f6 0%,#dfe2e6 45%,#f8f9fa 70%,#d5d8dd 100%);border-top:2px solid #afb3ba;font-size:14px}.footer strong{color:#555b65}

    body[data-mode="help"] .shell{width:min(1240px,calc(100% - 40px));padding:0}body[data-mode="help"] .capture{overflow:visible;padding:0;background:transparent}body[data-mode="help"] .loading,body[data-mode="help"] .error{margin:60px 0;background:#fff;border:2px solid var(--help-ink);box-shadow:8px 8px 0 var(--help-ink)}.help-surface{min-height:100vh}.help-hero{min-height:500px;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(300px,.88fr);align-items:center;gap:clamp(36px,7vw,96px);padding:54px 0 68px;border-bottom:2px solid var(--help-ink)}.help-brandline{display:flex;align-items:center;gap:12px;margin-bottom:24px;font-size:15px;font-weight:950}.help-brandline::before{content:"";width:42px;height:10px;background:var(--help-pink);border:2px solid var(--help-ink);box-shadow:4px 4px 0 var(--help-yellow)}.help-hero h1{display:block;margin:0;max-width:760px;color:var(--help-ink);background:transparent;box-shadow:none;font-size:clamp(48px,6.1vw,82px);line-height:.98}.help-hero h1 span{color:var(--help-pink);-webkit-text-stroke:2px var(--help-ink);text-shadow:5px 5px 0 var(--help-yellow)}.help-hero p{max-width:690px;margin:28px 0 0;color:var(--help-muted);font-size:19px;font-weight:700;line-height:1.65}.help-summary{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.help-summary span{padding:8px 12px;background:var(--help-white);border:2px solid var(--help-ink);font-size:14px;font-weight:900}.help-summary span:nth-child(2){background:var(--help-cyan)}.help-visual{position:relative;min-height:360px;display:grid;place-items:center}.help-grid-backdrop{position:absolute;inset:8% 2% 2% 10%;border:2px solid var(--help-ink);background-color:var(--help-white);background-image:linear-gradient(var(--help-line) 1px,transparent 1px),linear-gradient(90deg,var(--help-line) 1px,transparent 1px);background-size:32px 32px}.help-avatar-frame{position:relative;width:min(74%,310px);aspect-ratio:1;transform:rotate(-3deg)}.help-avatar-frame img{width:100%;height:100%;object-fit:cover;border:3px solid var(--help-ink);box-shadow:10px 10px 0 var(--help-ink)}.help-float-tag{position:absolute;z-index:2;padding:9px 13px;border:2px solid var(--help-ink);background:var(--help-yellow);box-shadow:4px 4px 0 var(--help-ink);font-weight:950}.help-float-tag.one{top:12%;right:1%;transform:rotate(4deg)}.help-float-tag.two{bottom:9%;left:1%;background:var(--help-cyan);transform:rotate(-4deg)}
    .help-workspace{padding:68px 0 94px}.help-section-heading{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,430px);align-items:end;gap:38px;margin-bottom:28px}.help-section-index{display:block;margin-bottom:10px;color:var(--help-pink);font-size:13px;font-weight:950}.help-section-heading h2{margin:0;font-size:clamp(38px,5vw,64px);line-height:1}.help-section-heading>p{margin:0;color:var(--help-muted);font-size:16px;font-weight:650;line-height:1.7}.help-quick-links{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 30px;padding:16px;background:var(--help-ink)}.help-quick-links[hidden]{display:none}.help-quick-links-label{align-self:center;margin-right:4px;color:var(--help-white);font-size:14px;font-weight:900}.help-online-link,.help-copy-button{min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:9px 14px;border:2px solid var(--help-ink);border-radius:0;cursor:pointer;font:900 14px "Microsoft YaHei",sans-serif;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}.help-online-link{background:var(--help-yellow)}.help-online-link::after{content:"↗";font-size:17px}.help-online-link:hover,.help-online-link:focus-visible,.help-copy-button:hover,.help-copy-button:focus-visible{outline:0;transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--help-ink)}.help-quick-links .help-online-link{border-color:var(--help-white)}.help-groups{display:grid;gap:28px}.help-subsection{scroll-margin-top:110px}.help-subsection-header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:12px}.help-subsection-header h3{margin:0;font-size:22px}.help-subsection-header p{margin:0;color:var(--help-muted);font-size:14px;font-weight:700}.help-list{display:block;padding:0;border:2px solid var(--help-ink);background:var(--help-white)}.help-item{display:grid;grid-template-columns:minmax(190px,.72fr) minmax(0,1.55fr);gap:26px;padding:24px;border:0;border-bottom:2px solid var(--help-ink);box-shadow:none}.help-item:last-child{border-bottom:0}.help-item::after{display:none}.help-item:nth-child(4n+1){--item-accent:var(--help-yellow)}.help-item:nth-child(4n+2){--item-accent:var(--help-pink-soft)}.help-item:nth-child(4n+3){--item-accent:var(--help-cyan)}.help-item:nth-child(4n){--item-accent:var(--help-green)}.help-item-copy{display:flex;flex-direction:column;align-items:flex-start}.help-item h4{margin:0 0 8px;font-size:22px;line-height:1.25}.help-item p{margin:0;color:var(--help-muted);font-size:15px;line-height:1.7}.help-command{margin:0;padding:15px 17px;color:var(--help-ink);background:var(--item-accent);border:2px solid var(--help-ink);white-space:pre-wrap;overflow-wrap:anywhere;font-family:Consolas,"Microsoft YaHei",monospace;font-size:15px;font-weight:800;line-height:1.65}.help-item-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.help-copy-button{background:var(--help-white)}.help-copy-button::before{content:"＋";font-size:17px}.help-item-actions .help-online-link{background:var(--help-ink);color:var(--help-white)}.help-footer{display:flex;justify-content:space-between;gap:24px;padding:26px 0;border-top:2px solid var(--help-ink);color:var(--help-muted);font-size:14px}.help-footer strong{color:var(--help-ink)}.help-toast{position:fixed;right:20px;bottom:20px;z-index:50;max-width:min(360px,calc(100vw - 40px));padding:13px 17px;color:#fff;background:var(--help-ink);border:2px solid var(--help-ink);box-shadow:5px 5px 0 var(--help-pink);font-weight:900;opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .18s ease,transform .18s ease}.help-toast.is-visible{opacity:1;transform:translateY(0)}
    @media(max-width:900px){body[data-mode="help"] .interactive-bar{grid-template-columns:1fr;gap:8px}body[data-mode="help"] .interactive-brand{justify-content:center}body[data-mode="help"] .control-row{grid-template-columns:repeat(3,minmax(0,1fr))}.help-hero{grid-template-columns:1fr;gap:30px}.help-visual{min-height:300px}.help-avatar-frame{width:min(56%,280px)}.help-section-heading{grid-template-columns:1fr}.help-item{grid-template-columns:1fr}.help-subsection-header{align-items:flex-start;flex-direction:column;gap:4px}}
    @media(max-width:720px){.shell{padding:12px}.masthead{grid-template-columns:1fr;padding:42px 24px 28px}.masthead::after{right:28px;top:22px;transform:rotate(14deg) scale(.78)}h1{font-size:40px}.signal{min-width:0}.content{padding:0 24px}.ranking-row{grid-template-columns:48px 52px minmax(0,1fr);gap:11px;padding:12px}.rank{width:46px;height:46px;font-size:20px}.avatar{width:48px;height:48px}.count{grid-column:3;justify-self:start}.person strong{font-size:18px}.chart-heading{align-items:flex-start;flex-direction:column}.chart-section{padding:18px 12px}.chart-labels{margin-left:54px;margin-right:12px}.chart-label .avatar{width:34px;height:34px}.chart-label strong{font-size:11px}.footer{align-items:flex-start;flex-direction:column;padding:20px 24px}.control-row button{padding:0 12px}body[data-mode="help"] .interactive-bar{padding-inline:12px}body[data-mode="help"] .control-row{display:flex;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-inline:contain;padding:2px 3px 6px;scrollbar-width:thin;scroll-snap-type:x proximity}body[data-mode="help"] .control-row button{flex:0 0 auto;min-width:118px;scroll-snap-align:start}body[data-mode="help"] .shell{width:min(100% - 24px,1240px);padding:0}.help-hero{min-height:0;padding:38px 0 44px}.help-hero h1{font-size:47px}.help-hero p{font-size:16px}.help-visual{min-height:190px}.help-avatar-frame{width:155px}.help-float-tag{font-size:13px}.help-workspace{padding:48px 0 68px}.help-section-heading h2{font-size:39px}.help-quick-links{padding:12px}.help-quick-links-label{width:100%}.help-online-link,.help-copy-button{min-height:46px}.help-item{gap:18px;padding:19px}.help-item h4{font-size:20px}.help-command{font-size:14px}.help-item-actions>*{flex:1 1 150px}.help-footer{align-items:flex-start;flex-direction:column}}

<body class="__COMMUNITY_CAPTURE_CLASS__" data-mode="__COMMUNITY_MODE__">
  <a class="skip-link" href="#capture-root">跳到主要内容</a>
  <div class="page">
    <header class="interactive-bar"><div class="interactive-brand"><img class="interactive-avatar" src="/assets/tangtang-avatar.jpg" alt=""><span id="interactive-title">A海岸社区</span></div><div class="control-row" id="primary-controls"></div><div class="control-row" id="secondary-controls"></div></header>
    <main class="shell"><article id="capture-root" class="capture"><div class="loading">正在整理社区数据...</div></article></main>
  </div>
  <script>
  (() => {
    const embedded = __COMMUNITY_PAYLOAD_JSON__;
    const root = document.querySelector('#capture-root');
    const mode = document.body.dataset.mode;
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const base = kind => location.pathname.startsWith('/' + kind) ? '/' + kind + '/api' : '/community/' + kind + '/api';
    const query = () => new URLSearchParams(location.search);
    const setControls = (element, items, current, attribute, change) => {
      element.innerHTML = items.map(item => `<button type="button" data-${attribute}="${esc(item.key)}" aria-selected="${String(item.key === current)}">${esc(item.label)}</button>`).join('');
      element.querySelectorAll('button').forEach(button => button.addEventListener('click', () => change(button.dataset[attribute])));
    };
    const avatarMarkup = (avatar, label) => avatar
      ? `<span class="avatar"><img src="${esc(avatar)}" alt=""></span>`
      : `<span class="avatar" aria-hidden="true">${esc(String(label || '?').trim().slice(0, 1) || '?')}</span>`;
    function renderChart(chart) {
      const rows = chart?.rows || [];
      if (!rows.length) return '';
      const width = 900, left = 72, right = 28, top = 42, bottom = 218;
      const maximum = Math.max(0, ...rows.map(row => Number(row.message_count || 0)));
      const upper = Math.max(4, Math.ceil(maximum / 4) * 4);
      const x = index => rows.length === 1 ? (left + width - right) / 2 : left + (width - left - right) * index / (rows.length - 1);
      const y = value => bottom - (bottom - top) * Number(value || 0) / upper;
      const grid = Array.from({length:5}, (_, index) => {
        const gy = top + (bottom - top) * index / 4;
        const value = upper - upper * index / 4;
        return `<line class="chart-grid" x1="${left}" y1="${gy}" x2="${width-right}" y2="${gy}"></line><text class="chart-scale" x="${left-12}" y="${gy+5}">${esc(Math.round(value))}</text>`;
      }).join('');
      const points = rows.map((row, index) => `${x(index)},${y(row.message_count)}`).join(' ');
      const markers = rows.map((row, index) => `<circle class="chart-point" cx="${x(index)}" cy="${y(row.message_count)}" r="7"></circle><text class="chart-value" x="${x(index)}" y="${Math.max(top + 15, y(row.message_count) - 17)}">${esc(row.message_count)}</text>`).join('');
      const labels = rows.map(row => `<div class="chart-label">${chart.kind === 'group' ? avatarMarkup(row.avatar, row.label) : ''}<strong>${esc(row.label)}</strong></div>`).join('');
      return `<section class="chart-section"><div class="chart-heading"><h2>${esc(chart.title)}</h2><p>${esc(chart.subtitle)}</p></div><svg class="chart-plot" viewBox="0 0 ${width} 236" role="img" aria-label="${esc(chart.title)}">${grid}<line class="chart-axis" x1="${left}" y1="${top}" x2="${left}" y2="${bottom}"></line><line class="chart-axis" x1="${left}" y1="${bottom}" x2="${width-right}" y2="${bottom}"></line><polyline class="chart-line" points="${points}"></polyline>${markers}</svg><div class="chart-labels" style="grid-template-columns:repeat(${rows.length},minmax(0,1fr))">${labels}</div></section>`;
    }
    function renderRanking(data) {
      document.title = `${data.title} · A海岸`;
      document.querySelector('#interactive-title').textContent = 'A海岸今日发言榜';
      setControls(document.querySelector('#primary-controls'), data.scope_options, data.scope, 'scope', scope => loadRanking(scope, data.group));
      setControls(document.querySelector('#secondary-controls'), data.group_options, data.group, 'group', group => loadRanking(data.scope, group));
      const ranking = data.rows?.length
        ? `<ol class="ranking-list">${data.rows.map(row => `<li class="ranking-row"><span class="rank">${esc(row.rank)}</span>${avatarMarkup(row.avatar, row.nickname)}<div class="person"><strong>${esc(row.nickname)}</strong>${row.group_name ? `<span>${esc(row.group_name)}</span>` : ''}</div><span class="count">${esc(row.message_count)} 条</span></li>`).join('')}</ol>`
        : '<div class="empty">本次统计范围内暂无发言记录。</div>';
      root.innerHTML = `<article class="community-card"><section class="masthead"><div><div class="brandline"><span class="face-mark" aria-hidden="true"></span><span>A海岸今日发言榜</span></div><h1>${esc(data.title)}</h1><p>${esc(data.subtitle)}</p></div><div class="signal"><strong>${Number(data.message_total || 0)}</strong><span>条发言记录</span></div></section><div class="content">${ranking}${renderChart(data.chart)}</div><footer class="footer"><span>数据按本地统计窗口实时汇总</span><strong>A海岸 Bot · Generated by Secmon</strong></footer></article>`;
    }
    let cachedHelp = null;
    let helpToastTimer = 0;
    const helpLinkMarkup = action => `<a class="help-online-link" href="${esc(action.target)}">${esc(action.label)}</a>`;
    const helpItemMarkup = item => {
      const actions = (item.actions || []).map(helpLinkMarkup).join('');
      return `<article class="help-item"><div class="help-item-copy"><h4>${esc(item.title)}</h4><p>${esc(item.description)}</p></div><div><div class="help-command">${esc(item.command)}</div><div class="help-item-actions"><button class="help-copy-button" type="button" data-copy-command="${esc(item.command)}">复制这一组指令</button>${actions}</div></div></article>`;
    };
    function showHelpToast(message) {
      const toast = document.querySelector('#help-toast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('is-visible');
      window.clearTimeout(helpToastTimer);
      helpToastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 1800);
    }
    async function copyHelpCommand(command, button) {
      const originalLabel = button?.textContent || '复制这一组指令';
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(command);
        else {
          const input = document.createElement('textarea');
          try {
            input.value = command;
            input.setAttribute('readonly', '');
            input.style.position = 'fixed';
            input.style.opacity = '0';
            document.body.appendChild(input);
            input.select();
            if (!document.execCommand('copy')) throw Error();
          } finally {
            input.remove();
          }
        }
        if (button) {
          button.textContent = '已复制';
          window.setTimeout(() => { button.textContent = originalLabel; }, 1800);
        }
        showHelpToast('指令已复制，可以回到 QQ 发送');
      } catch {
        showHelpToast('复制失败，请长按指令手动复制');
      }
    }
    root.addEventListener('click', event => {
      const button = event.target.closest('[data-copy-command]');
      if (button) copyHelpCommand(button.dataset.copyCommand || '', button);
    });
    function helpGroups(data) {
      if (data.groups?.length) return data.groups;
      return (data.categories || []).map((category, index) => ({
        key: `category-${index + 1}`,
        label: category.title,
        title: category.title,
        description: category.note || data.subtitle,
        sections: [category],
        quick_actions: [],
        item_count: category.items?.length || 0,
      }));
    }
    function updateHelpLocation(category, method) {
      const next = new URL(location.href);
      next.searchParams.set('category', category);
      history[method === 'push' ? 'pushState' : 'replaceState']({}, '', next);
    }
    function selectHelpGroup(data, category, method = 'push') {
      const groups = helpGroups(data);
      const current = groups.find(group => group.key === category) || groups[0];
      if (!current) return;
      renderHelp(data, current.key);
      updateHelpLocation(current.key, method);
    }
    function configureHelpTabs(data, currentKey) {
      const controls = document.querySelector('#primary-controls');
      const tabs = [...controls.querySelectorAll('button')];
      controls.setAttribute('role', 'tablist');
      controls.setAttribute('aria-label', '帮助分类');
      tabs.forEach(tab => {
        tab.setAttribute('role', 'tab');
        tab.setAttribute('aria-controls', 'help-panel');
        tab.tabIndex = tab.dataset.category === currentKey ? 0 : -1;
      });
      controls.onkeydown = event => {
        const currentTab = event.target.closest('[data-category]');
        if (!currentTab) return;
        const index = tabs.indexOf(currentTab);
        let nextIndex = index;
        if (event.key === 'ArrowRight' || event.key === 'ArrowDown') nextIndex = (index + 1) % tabs.length;
        else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') nextIndex = (index - 1 + tabs.length) % tabs.length;
        else if (event.key === 'Home') nextIndex = 0;
        else if (event.key === 'End') nextIndex = tabs.length - 1;
        else return;
        event.preventDefault();
        const nextKey = tabs[nextIndex].dataset.category;
        selectHelpGroup(data, nextKey, 'push');
        document.querySelector(`[data-category="${CSS.escape(nextKey)}"]`)?.focus();
      };
    }
    function renderHelp(data, requestedCategory) {
      cachedHelp = data;
      document.title = `${data.title || '糖糖在线帮助'} · A海岸`;
      document.querySelector('#interactive-title').textContent = '糖糖在线帮助';
      const groups = helpGroups(data);
      const current = groups.find(group => group.key === requestedCategory) || groups[0];
      if (!current) {
        root.innerHTML = '<div class="error">帮助内容暂时为空。</div>';
        return;
      }
      const controls = document.querySelector('#primary-controls');
      setControls(controls, groups.map(group => ({key:group.key,label:group.label})), current.key, 'category', category => selectHelpGroup(data, category, 'push'));
      configureHelpTabs(data, current.key);
      document.querySelector('#secondary-controls').innerHTML = '';
      const totalItems = groups.reduce((total, group) => total + Number(group.item_count || 0), 0);
      const groupIndex = groups.findIndex(group => group.key === current.key) + 1;
      const quickActions = (current.quick_actions || []).map(helpLinkMarkup).join('');
      const sections = (current.sections || []).map(section => `<section class="help-subsection"><header class="help-subsection-header"><h3>${esc(section.title)}</h3>${section.note ? `<p>${esc(section.note)}</p>` : ''}</header><div class="help-list">${(section.items || []).map(helpItemMarkup).join('')}</div></section>`).join('');
      root.innerHTML = `<article class="help-surface"><section class="help-hero"><div><div class="help-brandline">A海岸社区机器人</div><h1>想做什么，<br><span>点一下就知道</span></h1><p>${esc(data.subtitle)}</p><div class="help-summary"><span>${groups.length} 个功能大类</span><span>${totalItems} 项完整入口</span><span>传统 QQ 指令仍然可用</span></div></div><div class="help-visual" aria-hidden="true"><div class="help-grid-backdrop"></div><div class="help-avatar-frame"><img src="/assets/tangtang-avatar.jpg" alt=""></div><span class="help-float-tag one">#帮助</span><span class="help-float-tag two">WEB + QQ</span></div></section><section class="help-workspace" id="help-panel" role="tabpanel"><header class="help-section-heading"><div><span class="help-section-index">功能 ${String(groupIndex).padStart(2, '0')} / ${String(groups.length).padStart(2, '0')}</span><h2>${esc(current.title)}</h2></div><p>${esc(current.description)}</p></header><nav class="help-quick-links" aria-label="在线快捷入口" ${quickActions ? '' : 'hidden'}><span class="help-quick-links-label">直接打开网页</span>${quickActions}</nav><div class="help-groups">${sections}</div></section><footer class="help-footer"><span>帮助内容与当前机器人普通用户指令同步</span><strong>A海岸 Bot · Generated by Secmon</strong></footer><div class="help-toast" id="help-toast" role="status" aria-live="polite"></div></article>`;
    }
    async function loadRanking(scope, group) {
      root.innerHTML = '<div class="loading">正在汇总发言数据...</div>';
      try {
        const response = await fetch(`${base('ranking')}?scope=${encodeURIComponent(scope)}&group=${encodeURIComponent(group)}`);
        if (!response.ok) throw Error();
        const data = await response.json();
        renderRanking(data);
        const next = new URL(location.href);
        next.searchParams.set('scope', data.scope);
        next.searchParams.set('group', data.group);
        history.replaceState({}, '', next);
      } catch {
        root.innerHTML = '<div class="error">发言榜暂时无法读取，请稍后刷新。</div>';
      }
    }
    async function loadHelp(category) {
      root.innerHTML = '<div class="loading">正在整理帮助内容...</div>';
      try {
        const response = await fetch(base('help'));
        if (!response.ok) throw Error();
        const data = await response.json();
        selectHelpGroup(data, category, 'replace');
      } catch {
        root.innerHTML = '<div class="error">帮助内容暂时无法读取，请稍后刷新。</div>';
      }
    }
    window.addEventListener('popstate', () => {
      if (mode === 'help' && cachedHelp) renderHelp(cachedHelp, query().get('category') || 'start');
    });
    if (embedded) {
      mode === 'ranking' ? renderRanking(embedded) : renderHelp(embedded, query().get('category') || 'start');
      return;
    }
    if (mode === 'ranking') loadRanking(query().get('scope') || 'day', query().get('group') || 'a-coast');
    else loadHelp(query().get('category') || '使用说明');
  })();
  </script>
</body>
</html>
