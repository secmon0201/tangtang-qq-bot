<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>糖糖公告</title>
  <style>
    :root { --ink:#302932; --muted:#716773; --pink:#e95d91; --line:#ead7df; --paper:#fffdfd; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:#f8f4f6; font:15px/1.55 "Microsoft YaHei",system-ui,sans-serif; } main { width:min(1040px,100%); margin:auto; padding:28px 20px 44px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:22px; } h1 { margin:0; font-size:26px; } h2 { margin:0 0 14px; font-size:17px; } .scope,.hint,.counter { color:var(--muted); font-size:13px; } .timer { color:var(--pink); font-weight:700; white-space:nowrap; }
    .tabs,.choice { display:flex; gap:8px; flex-wrap:wrap; } .tabs { margin-bottom:16px; } button { appearance:none; border:1px solid var(--line); background:#fff; color:var(--ink); font:inherit; cursor:pointer; padding:9px 14px; border-radius:6px; } button:hover { border-color:var(--pink); } button.active,button.primary { background:var(--pink); color:#fff; border-color:var(--pink); } button:disabled { opacity:.45; cursor:not-allowed; }
    .grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(320px,.85fr); gap:16px; } section { background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:20px; } label { display:block; margin:13px 0 6px; font-weight:700; } textarea,input { width:100%; border:1px solid #d7c6ce; border-radius:6px; padding:10px; background:#fff; font:inherit; } textarea { min-height:180px; resize:vertical; } textarea.extra-text { min-height:88px; }
    .choice button { padding:7px 10px; font-size:14px; } .check { display:flex; align-items:center; gap:8px; margin-top:15px; font-weight:400; } .check input { width:auto; accent-color:var(--pink); } .counter { float:right; font-weight:400; } .hint { margin:7px 0 0; }
    .preview { min-height:340px; display:flex; align-items:center; justify-content:center; background:#fff8fb; border:1px dashed #e4b7c8; border-radius:6px; overflow:hidden; } .preview img { width:100%; height:auto; display:block; } .preview.loading { min-height:340px; } .empty { color:var(--muted); padding:28px; text-align:center; } .loading-note { display:flex; align-items:center; gap:10px; color:var(--muted); padding:28px; text-align:center; } .spinner { width:18px; height:18px; border:2px solid #f3c6d7; border-top-color:var(--pink); border-radius:50%; animation:spin .7s linear infinite; } @keyframes spin { to { transform:rotate(360deg); } } .actions { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-top:18px; } .result { display:none; margin-top:16px; padding:12px; border-radius:6px; } .result.ok { display:block; color:#17613f; background:#edf9f2; } .result.error { display:block; color:#a43353; background:#fff0f4; }
    .upload-drop { padding:18px; border:1px dashed #d9b8c6; border-radius:6px; background:#fff9fb; } .role-picker { margin-top:18px; padding-top:4px; border-top:1px solid #f0dfe6; } .hidden { display:none!important; } @media (max-width:760px) { main { padding:18px 12px 32px; } header { align-items:flex-start; flex-direction:column; } .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>糖糖公告</h1><div class="scope" id="scope">正在校验公告链接</div></div><div class="timer" id="timer"></div></header>
  <div class="tabs"><button class="active" data-mode="text">文字海报</button><button data-mode="graphic">图文海报</button><button data-mode="image">原图公告</button></div>
  <div class="grid"><section id="editor">
    <div id="textForm"><label>公告正文 <span class="counter" id="counter">0 / 1000</span></label><textarea id="text" maxlength="1000" placeholder="输入将呈现在公告海报上的内容"></textarea><label>附加文字（可选） <span class="counter" id="textExtraCounter">0 / 1000</span></label><textarea class="extra-text" id="textExtra" maxlength="1000" placeholder="不写入海报；发送时会显示在图片下方"></textarea><label class="check"><input id="atAllText" type="checkbox"> 提醒全体成员</label><div class="actions"><button id="previewText">生成预览</button><button class="primary" id="sendPreview" disabled>确认发送</button></div></div>
    <div id="graphicForm" class="hidden"><div class="upload-drop"><label for="graphicImage">选择主图</label><input id="graphicImage" type="file" accept="image/png,image/jpeg,image/webp"><p class="hint">支持 PNG、JPG、JPEG、WebP，最大 20 MiB。</p></div><label>公告标题 <span class="counter" id="graphicTitleCounter">0 / 80</span></label><input id="graphicTitle" type="text" maxlength="80" placeholder="例如：夏日群联动活动开放报名"><label>公告正文 <span class="counter" id="graphicCounter">0 / 1000</span></label><textarea id="graphicText" maxlength="1000" placeholder="正文会自动换行并按内容增加海报高度"></textarea><label>附加文字（可选） <span class="counter" id="graphicExtraCounter">0 / 1000</span></label><textarea class="extra-text" id="graphicExtra" maxlength="1000" placeholder="不写入海报；发送时会显示在图片下方"></textarea><label class="check"><input id="atAllGraphic" type="checkbox"> 提醒全体成员</label><div class="actions"><button id="previewGraphic">生成图文预览</button><button class="primary" id="sendGraphic" disabled>确认发送</button></div></div>
    <div id="imageForm" class="hidden"><div class="upload-drop"><label for="image">选择原图</label><input id="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp"><p class="hint">支持 PNG、JPG、JPEG、GIF、WebP，最大 20 MiB。选择后不会上传或生成预览；确认发送时才会一次上传原文件。</p></div><label>附加文字（可选） <span class="counter" id="imageExtraCounter">0 / 1000</span></label><textarea class="extra-text" id="imageExtra" maxlength="1000" placeholder="发送时会显示在图片下方"></textarea><label class="check"><input id="atAllImage" type="checkbox"> 提醒全体成员</label><div class="actions"><span class="hint" id="fileName">尚未选择图片</span><button class="primary" id="sendImage" disabled>发送原图</button></div></div>
    <div id="rolePicker" class="role-picker"><label>角色</label><div class="choice" id="members"></div><label>表情</label><div class="choice" id="stickers"></div><p class="hint">图文海报选择“无角色”后，会保留更完整的文字区域。</p></div><div id="result" class="result"></div>
  </section><section><h2 id="previewTitle">海报预览</h2><div class="preview" id="previewBox"><div class="empty">填写公告内容后生成预览。<br>预览所见即最终发送效果。</div></div></section></div>
</main>
<script>
(() => {
  const segments=location.pathname.split('/').filter(Boolean),token=segments.pop(),area=segments[0]==='notice'?'notice':'announcement',api=`/${area}/api/${encodeURIComponent(token)}`; const state={mode:'text',member:'__random__',sticker:'__random__',hasPreview:false,config:null,previewUrl:null,previewPending:false}; const $=id=>document.getElementById(id);
  const result=(text,error=false)=>{const e=$('result');e.textContent=text;e.className='result '+(error?'error':'ok');}; const clearResult=()=>{$('result').className='result';}; const selected=(c,value)=>[...c.children].forEach(b=>b.classList.toggle('active',b.dataset.value===value)); const invalidate=()=>{state.hasPreview=false;$('sendPreview').disabled=true;$('sendGraphic').disabled=true;}; const previewLabels={previewText:'生成预览',previewGraphic:'生成图文预览'}; const setPreviewBusy=(busy,id)=>{const button=$(id);state.previewPending=busy;button.disabled=busy;button.textContent=busy?'正在生成预览…':previewLabels[id];if(busy){$('previewBox').className='preview loading';$('previewBox').innerHTML='<div class="loading-note"><span class="spinner"></span><span>正在生成预览，请稍候…</span></div>';result('正在生成预览，请稍候。');}}; const showPreviewError=message=>{$('previewBox').className='preview';$('previewBox').innerHTML='<div class="empty">预览生成失败，请检查网络后重试。</div>';result(message,true);};
  const renderStickers=()=>{const c=$('stickers');c.innerHTML='';if(state.member==='__none__'){c.innerHTML='<span class="hint">未使用角色表情</span>';return;}const items=state.member==='__random__'?[]:(state.config.stickers[state.member]||[]);[['__random__','随机表情'],...items.map(x=>[x,x])].forEach(([value,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.value=value;b.onclick=()=>{state.sticker=value;selected(c,value);invalidate();};c.append(b);});selected(c,state.sticker);};
  const renderMembers=()=>{const c=$('members');c.innerHTML='';[['__random__','随机角色'],['__none__','无角色'],...state.config.members.map(x=>[x,x])].forEach(([value,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.value=value;b.onclick=()=>{state.member=value;state.sticker='__random__';selected(c,value);renderStickers();invalidate();};c.append(b);});selected(c,state.member);renderStickers();};
  const switchMode=mode=>{state.mode=mode;invalidate();$('textForm').classList.toggle('hidden',mode!=='text');$('graphicForm').classList.toggle('hidden',mode!=='graphic');$('imageForm').classList.toggle('hidden',mode!=='image');$('rolePicker').classList.toggle('hidden',mode==='image');$('previewTitle').textContent=mode==='graphic'?'图文海报预览':mode==='image'?'原图公告':'海报预览';if(mode==='image')$('previewBox').innerHTML='<div class="empty">原图不会生成或回传预览。确认发送后，机器人会上传并发送所选原文件。</div>';[...document.querySelectorAll('.tabs button')].forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));clearResult();};
  const request=async(path,options={})=>{const r=await fetch(api+path,options);const payload=await r.json().catch(()=>({detail:'请求失败'}));if(!r.ok)throw new Error(payload.detail||'请求失败');return payload;}; const uploadRequest=(path,form,onProgress)=>new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST',api+path);xhr.responseType='json';xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded,e.total,false);};xhr.upload.onload=()=>onProgress(1,1,true);xhr.onerror=()=>reject(new Error('网络连接失败，请重试。'));xhr.onload=()=>{const payload=xhr.response||{};if(xhr.status>=200&&xhr.status<300)resolve(payload);else reject(new Error(payload.detail||'请求失败'));};xhr.send(form);}); const previewRequest=async(path,options={})=>{const r=await fetch(api+path,options);if(!r.ok){const payload=await r.json().catch(()=>({detail:'请求失败'}));throw new Error(payload.detail||'请求失败');}const image=await r.blob();if(!image.type.startsWith('image/'))throw new Error('预览响应不是图片');return image;}; const showPreview=image=>{if(state.previewUrl)URL.revokeObjectURL(state.previewUrl);state.previewUrl=URL.createObjectURL(image);$('previewBox').className='preview';$('previewBox').innerHTML=`<img alt="公告海报预览" src="${state.previewUrl}">`;state.hasPreview=true;$(state.mode==='graphic'?'sendGraphic':'sendPreview').disabled=false;result('预览已生成，可以确认发送。');};
  $('text').oninput=()=>{$('counter').textContent=`${$('text').value.length} / 1000`;invalidate();}; $('textExtra').oninput=()=>{$('textExtraCounter').textContent=`${$('textExtra').value.length} / 1000`;invalidate();}; $('graphicTitle').oninput=()=>{$('graphicTitleCounter').textContent=`${$('graphicTitle').value.length} / 80`;invalidate();}; $('graphicText').oninput=()=>{$('graphicCounter').textContent=`${$('graphicText').value.length} / 1000`;invalidate();}; $('graphicExtra').oninput=()=>{$('graphicExtraCounter').textContent=`${$('graphicExtra').value.length} / 1000`;invalidate();}; $('imageExtra').oninput=()=>{$('imageExtraCounter').textContent=`${$('imageExtra').value.length} / 1000`;}; $('graphicImage').onchange=invalidate; $('atAllText').onchange=invalidate; $('atAllGraphic').onchange=invalidate;
  $('previewText').onclick=async()=>{if(state.previewPending)return;clearResult();const text=$('text').value.trim();if(!text){result('请先填写公告正文。',true);return;}setPreviewBusy(true,'previewText');try{showPreview(await previewRequest('/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,extra_text:$('textExtra').value.trim(),member:state.member,sticker:state.sticker,at_all:$('atAllText').checked})}));}catch(e){showPreviewError(e.message);}finally{setPreviewBusy(false,'previewText');}};
  $('previewGraphic').onclick=async()=>{if(state.previewPending)return;clearResult();const file=$('graphicImage').files[0],title=$('graphicTitle').value.trim(),text=$('graphicText').value.trim();if(!file||!title||!text){result('请填写主图、标题和正文。',true);return;}const form=new FormData();form.append('image',file);form.append('title',title);form.append('text',text);form.append('extra_text',$('graphicExtra').value.trim());form.append('member',state.member);form.append('sticker',state.sticker);form.append('at_all',$('atAllGraphic').checked?'true':'false');setPreviewBusy(true,'previewGraphic');try{showPreview(await previewRequest('/graphic-preview',{method:'POST',body:form}));}catch(e){showPreviewError(e.message);}finally{setPreviewBusy(false,'previewGraphic');}};
  const sendPreview=async()=>{if(!state.hasPreview||!confirm('确认向固定目标群发送此海报？'))return;try{const data=await request('/send-preview',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});result(`已发送至 ${data.sent} 个目标群；失败 ${data.failed} 个。`);$('sendPreview').disabled=true;$('sendGraphic').disabled=true;}catch(e){result(e.message,true);}}; $('sendPreview').onclick=sendPreview;$('sendGraphic').onclick=sendPreview;
  $('image').onchange=()=>{const f=$('image').files[0];$('fileName').textContent=f?`${f.name} (${Math.ceil(f.size/1024)} KiB)；确认后上传一次原文件`:'尚未选择图片';$('sendImage').disabled=!f;}; $('sendImage').onclick=async()=>{const file=$('image').files[0];if(!file||!confirm('确认向固定目标群发送此原图？'))return;const form=new FormData();form.append('image',file);form.append('extra_text',$('imageExtra').value.trim());form.append('at_all',$('atAllImage').checked?'true':'false');const button=$('sendImage');button.disabled=true;button.textContent='正在上传原图…';try{const data=await uploadRequest('/send-image',form,(loaded,total,complete)=>{if(complete){button.textContent='正在发送原图…';$('fileName').textContent='原图已上传，正在发送至目标群。';}else{$('fileName').textContent=`正在上传原图：${Math.floor(loaded*100/total)}%`;}});result(`已发送至 ${data.sent} 个目标群；失败 ${data.failed} 个。`);button.textContent='已发送';}catch(e){button.disabled=false;button.textContent='发送原图';result(e.message,true);}};
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode)); request('/state').then(data=>{state.config=data;$('scope').textContent=`固定发送至 ${data.targets} 个目标群；链接仅限本次操作。`;$('timer').textContent=`剩余 ${Math.ceil(data.remaining_seconds/60)} 分钟`;renderMembers();setInterval(()=>{data.remaining_seconds--;$('timer').textContent=data.remaining_seconds>0?`剩余 ${Math.ceil(data.remaining_seconds/60)} 分钟`:'链接已过期';},1000);}).catch(e=>{$('scope').textContent=e.message;$('editor').classList.add('hidden');});
})();
</script>
</body>
</html>
