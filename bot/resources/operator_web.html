<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运营工作台</title><style>
:root{--ink:#302932;--muted:#716773;--pink:#e95d91;--soft:#fff0f5;--line:#ead7df;--paper:#fffdfd;--good:#17613f;--bad:#a43353}*{box-sizing:border-box}body{margin:0;background:#f8f4f6;color:var(--ink);font:15px/1.55 "Microsoft YaHei",system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:26px 20px 48px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}h1{font-size:26px;margin:0}h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:0 0 9px}.muted{font-size:13px;color:var(--muted)}.timer{color:var(--pink);font-weight:700;white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:16px}.wide{grid-column:1/-1}section{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px}.tabs,.actions,.choice{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:16px}button{font:inherit;border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:#fff;color:var(--ink);cursor:pointer}button:hover{border-color:var(--pink)}button.primary,button.active{background:var(--pink);border-color:var(--pink);color:#fff}button.danger{color:var(--bad)}button:disabled{opacity:.45;cursor:not-allowed}label{display:block;font-weight:700;margin:11px 0 5px}input,textarea,select{font:inherit;width:100%;padding:9px;border:1px solid #d7c6ce;border-radius:6px;background:#fff}textarea{min-height:96px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.checks label{margin:0;padding:8px;border:1px solid var(--line);border-radius:6px;font-weight:400}.checks input{width:auto;margin-right:6px}.list{display:grid;gap:8px;max-height:540px;overflow:auto}.item{border:1px solid var(--line);border-radius:6px;padding:11px;background:#fff}.item strong{display:block}.meta{font-size:13px;color:var(--muted);margin-top:3px}.result{display:none;margin-top:12px;padding:10px;border-radius:6px}.result.ok,.result.error{display:block}.result.ok{background:#edf9f2;color:var(--good)}.result.error{background:#fff0f4;color:var(--bad)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:8px;vertical-align:top}th{color:var(--muted)}.hidden{display:none!important}@media(max-width:760px){main{padding:18px 12px}.grid,.row{grid-template-columns:1fr}.checks{grid-template-columns:1fr}header{flex-direction:column}}
</style></head><body><main><header><div><h1 id="title">运营工作台</h1><div class="muted" id="scope">正在校验链接</div></div><div class="timer" id="timer"></div></header><div id="result" class="result"></div><div id="activity" class="hidden"><div class="grid"><section><h2>创建活动</h2><div class="row"><div><label>活动名称</label><input id="a-title" maxlength="80"></div><div><label>类型</label><select id="a-type"><option>通报</option><option>抽奖</option></select></div></div><div class="row"><div><label>开始时间</label><input id="a-start" type="datetime-local"></div><div><label>结束时间</label><input id="a-end" type="datetime-local"></div></div><label>说明</label><textarea id="a-desc" maxlength="500"></textarea><label>奖项（抽奖必填，如 一等奖=1；二等奖=2）</label><input id="a-prizes"><label>参与群</label><div id="a-groups" class="checks"></div><label>名单隐私</label><select id="a-visibility"><option value="脱敏">脱敏</option><option value="公开">公开</option></select><div class="actions"><button id="a-create" class="primary">发布活动</button></div></section><section><h2>活动管理</h2><div id="a-list" class="list"></div></section></div></div><div id="operations" class="hidden"><div class="grid"><section><h2>功能群范围</h2><label>功能</label><select id="o-feature"></select><div id="o-groups" class="checks"></div><div class="actions"><button id="o-save-scope" class="primary">保存范围</button></div></section><section><h2>过滤名单</h2><label>名单类型</label><select id="o-filter-kind"><option value="active">主动过滤</option><option value="passive">被动过滤</option></select><label>QQ 号（逗号或空格分隔）</label><input id="o-filter-ids"><div class="actions"><button id="o-filter-add">添加</button><button id="o-filter-remove">移除</button></div><div id="o-filters" class="list"></div></section><section class="wide"><h2>被动互动参数</h2><div id="o-passive" class="list"></div></section></div></div><div id="duplicate" class="hidden"><div class="grid"><section><h2>查重范围</h2><label>模式</label><select id="d-mode"><option value="source">起点群与目标群</option><option value="all">全部群互查</option></select><div class="muted">起点模式下按勾选顺序的第一个群作为起点。</div><label>群</label><div id="d-groups" class="checks"></div><label class="muted"><input id="d-ignore" type="checkbox" style="width:auto"> 忽略白名单</label><div class="actions"><button id="d-scan" class="primary">开始查重</button></div></section><section><h2>查重白名单</h2><label>QQ 号</label><input id="d-user"><label>备注</label><input id="d-note"><div class="actions"><button id="d-add">添加或更新</button><button id="d-remove">移除</button></div><div id="d-white" class="list"></div></section><section class="wide"><h2>查重结果</h2><div id="d-results" class="muted">请选择范围后开始查重。</div></section></div></div></main><script>
(()=>{const segments=location.pathname.split('/').filter(Boolean),token=segments.pop(),publicArea=segments[0],publicKinds=new Set(['activity','operations','duplicate']),kind=publicKinds.has(publicArea)?publicArea:(new URLSearchParams(location.search).get('kind')||'operations'),api=publicKinds.has(publicArea)?`/${publicArea}/api/${encodeURIComponent(token)}`:`/operator/api/${kind}/${encodeURIComponent(token)}`,$=id=>document.getElementById(id);let state;const result=(t,b=false)=>{const e=$('result');e.textContent=t;e.className='result '+(b?'error':'ok')},request=async(path,opt={})=>{const r=await fetch(api+path,opt),p=await r.json().catch(()=>({detail:'请求失败'}));if(!r.ok)throw Error(p.detail||'请求失败');return p},selected=(id)=>[...$(id).querySelectorAll('input:checked')].map(x=>Number(x.value)),checks=(id,groups,values=[])=>$(id).innerHTML=groups.map(g=>`<label><input type="checkbox" value="${g.id}" ${values.includes(g.id)?'checked':''}>${g.name} (${g.id})</label>`).join(''),time=v=>String(v||'').replace(' ','T').slice(0,16),refresh=()=>request('/state').then(render).catch(e=>{result(e.message,true);$('scope').textContent=e.message});
function activity(){let editing=0; $('activity').classList.remove('hidden');$('title').textContent='跨群活动';checks('a-groups',state.groups);$('a-list').innerHTML=state.activities.map(a=>`<div class="item"><strong>#${a.activity_id} ${a.title}</strong><div class="meta">${a.status} · ${a.participant_count} 人 · ${String(a.starts_at).replace('T',' ')}</div><div class="meta">${a.groups.map(g=>g.group_name||g.group_id).join('、')}</div>${a.can_manage&&['scheduled','active'].includes(a.status)?`<div class="actions"><button data-edit="${a.activity_id}">编辑</button><button data-finish="${a.activity_id}">提前结束</button><button data-cancel="${a.activity_id}" class="danger">取消</button></div>`:''}</div>`).join('')||'<div class="muted">暂无活动</div>'; $('a-create').onclick=async()=>{try{const body={title:$('a-title').value,starts:$('a-start').value.replace('T',' '),ends:$('a-end').value.replace('T',' '),type:$('a-type').value,description:$('a-desc').value,prizes:$('a-prizes').value,groups:selected('a-groups'),visibility:$('a-visibility').value};await request(editing?`/${editing}/update`:'/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});result(editing?'活动修改已保存。':'活动已创建，正在等待既有广播流程发送通知。');editing=0;$('a-create').textContent='发布活动';refresh()}catch(e){result(e.message,true)}}; $('a-list').onclick=async e=>{const id=e.target.dataset.finish||e.target.dataset.cancel;if(e.target.dataset.edit){const a=state.activities.find(x=>x.activity_id==e.target.dataset.edit);editing=a.activity_id;$('a-create').textContent=`保存 #${editing} 修改`;$('a-title').value=a.title;$('a-start').value=time(a.starts_at);$('a-end').value=time(a.ends_at);$('a-type').value=a.activity_type==='lottery'?'抽奖':'通报';$('a-desc').value=a.description;$('a-prizes').value=a.prizes.map(p=>`${p.prize_name}=${p.quantity}`).join('；');$('a-visibility').value=a.visibility==='public'?'公开':'脱敏';checks('a-groups',state.groups,a.groups.map(g=>g.group_id));result(`已载入活动 #${a.activity_id}，修改字段后保存。`);return}if(!id)return;const action=e.target.dataset.finish?'finish':'cancel';if(!confirm(action==='finish'?'确认提前结束活动？':'确认取消活动？'))return;try{await request(`/${id}/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:''})});result('活动状态已更新。');refresh()}catch(err){result(err.message,true)}} }
function operations(){ $('operations').classList.remove('hidden');$('title').textContent='运营配置';$('o-feature').innerHTML=Object.entries(state.scope_labels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');const drawScope=()=>checks('o-groups',state.groups,state.scopes[$('o-feature').value]||[]);$('o-feature').onchange=drawScope;drawScope();$('o-save-scope').onclick=async()=>{try{await request('/scope',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({feature:$('o-feature').value,groups:selected('o-groups')})});result('功能范围已保存并立即生效。');refresh()}catch(e){result(e.message,true)}};const drawFilters=()=>{$('o-filters').innerHTML=(state.filters[$('o-filter-kind').value]||[]).map(x=>`<div class="item">${x.user_id}</div>`).join('')||'<div class="muted">名单为空</div>'};$('o-filter-kind').onchange=drawFilters;drawFilters();for(const action of ['add','remove'])$('o-filter-'+action).onclick=async()=>{try{const ids=$('o-filter-ids').value.split(/[，,\s]+/).filter(Boolean).map(Number);await request(`/filter/${$('o-filter-kind').value}/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_ids:ids})});result('名单已更新。');refresh()}catch(e){result(e.message,true)}};$('o-passive').innerHTML=state.passive.map(p=>`<div class="item"><strong>${p.group_id}</strong><div class="row"><label>表情概率<input data-k="reaction_probability" data-g="${p.group_id}" type="number" step=".01" value="${p.reaction_probability}"></label><label>表情冷却秒<input data-k="reaction_cooldown_seconds" data-g="${p.group_id}" type="number" value="${p.reaction_cooldown_seconds}"></label><label>复读概率<input data-k="repeat_probability" data-g="${p.group_id}" type="number" step=".01" value="${p.repeat_probability}"></label><label>复读冷却秒<input data-k="repeat_cooldown_seconds" data-g="${p.group_id}" type="number" value="${p.repeat_cooldown_seconds}"></label><label>复读间隔<input data-k="repeat_message_interval" data-g="${p.group_id}" type="number" value="${p.repeat_message_interval}"></label><label>三连概率<input data-k="triple_repeat_probability" data-g="${p.group_id}" type="number" step=".01" value="${p.triple_repeat_probability}"></label></div><label class="muted"><input data-k="triple_repeat_enabled" data-g="${p.group_id}" type="checkbox" ${p.triple_repeat_enabled?'checked':''} style="width:auto"> 启用三连复读</label><button data-save-passive="${p.group_id}">保存本群参数</button></div>`).join('');$('o-passive').onclick=async e=>{const g=e.target.dataset.savePassive;if(!g)return;try{const v={};document.querySelectorAll(`[data-g="${g}"]`).forEach(x=>v[x.dataset.k]=x.type==='checkbox'?x.checked:Number(x.value));await request('/passive/'+g,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});result('本群参数已保存。')}catch(err){result(err.message,true)}} }
function duplicate(){ $('duplicate').classList.remove('hidden');$('title').textContent='查重与白名单';checks('d-groups',state.groups);const draw=()=>{$('d-white').innerHTML=state.whitelist.map(x=>`<div class="item"><strong>${x.user_id} ${x.nickname||''}</strong><div class="meta">${x.note||'无备注'}</div></div>`).join('')||'<div class="muted">白名单为空</div>'};draw();$('d-add').onclick=()=>white('add');$('d-remove').onclick=()=>white('remove');async function white(a){try{await request('/whitelist/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:$('d-user').value,note:$('d-note').value})});result('白名单已更新。');refresh()}catch(e){result(e.message,true)}}$('d-scan').onclick=async()=>{try{const r=await request('/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({groups:selected('d-groups'),mode:$('d-mode').value,ignore_whitelist:$('d-ignore').checked})});$('d-results').innerHTML=`共 ${r.count} 名重复成员`+(r.rows.length?`<table><thead><tr><th>QQ</th><th>昵称</th><th>出现群</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${x.user_id}</td><td>${x.nickname||''}</td><td>${x.groups.map(g=>g.group_name||g.group_id).join('、')}</td></tr>`).join('')}</tbody></table>`:'');result('查重完成。')}catch(e){result(e.message,true)}} }
function render(s){state=s;$('scope').textContent='链接仅限本次操作；所有变更立即按原有权限和范围规则执行。';$('timer').textContent=`剩余 ${Math.ceil(s.remaining_seconds/60)} 分钟`;if(kind==='activity')activity();else if(kind==='operations')operations();else duplicate()}refresh();})();
</script></body></html>
