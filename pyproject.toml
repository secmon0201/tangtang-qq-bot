[project]
name = "qq-local-data-bot"
version = "0.1.0"
description = "Local QQ group data bot built on NoneBot2 and OneBot v11"
requires-python = ">=3.13"
dependencies = [
    "nonebot2[fastapi]>=2.4.0,<3.0.0",
    "nonebot-adapter-onebot>=2.4.0,<3.0.0",
    "nonebot-adapter-qq>=1.7.1,<2.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
    "truststore>=0.10.0,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "Pillow>=11.0.0,<13.0.0",
    "playwright>=1.61.0,<2.0.0",
    "bilibili-api-python>=17.4.2,<18.0.0",
    # GsUID Core 0.10.7 currently requires qrcode<8; keep the shared
    # environment within the compatible range until Core raises that cap.
    "qrcode[pil]>=7.3.1,<8.0.0",
]

[project.scripts]
qq-local-bot = "bot.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "psutil>=6.0,<8.0",
    "pyinstaller>=6.0,<7.0",
]
gsuid = [
    "nonebot-plugin-apscheduler>=0.3.0,<1.0.0",
    "nonebot-plugin-genshinuid @ git+https://github.com/KimigaiiWuyi/GenshinUID.git@v4-nonebot2",
    "fonttools>=4.0.0,<5.0.0",
]

[tool.nonebot]
plugin_dirs = ["bot/plugins"]
driver = "~fastapi"
host = "127.0.0.1"
port = 8080
command_start = ["#"]
command_sep = ["."]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
