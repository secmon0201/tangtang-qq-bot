<section class="section" id="boundaries"><div class="page-shell"><div class="section-heading reveal"><div><span class="section-label">玩法与边界</span><h2>一边即时开局，一边清楚分流</h2></div><p>第二个主要区块仍然各占一半：本地侧说明对局条件，NTE 侧保留排行范围交互和完整入口。</p></div><div class="world-details reveal"><article class="world-detail"><h3>本地对局规则</h3><p>游戏群、全局开关和本群开关共同决定是否可玩；枝江直播防护只暂停本地小游戏，不影响 NTE。</p><div class="signal-stack"><div class="signal-card"><i data-lucide="timer-reset"></i><div><strong>按局况触发事件</strong><small>人数、持有者、弹仓与历史状态都会参与判定</small></div><time>LOCAL</time></div><div class="signal-card"><i data-lucide="database"></i><div><strong>对局可恢复</strong><small>本地 SQLite 保存状态与战绩</small></div><time>SQLITE</time></div></div></article><article class="world-detail"><h3>NTE 排行范围</h3><div aria-label="NTE 排行范围" class="scope-switch" role="tablist"><button aria-selected="true" data-scope="acoast" role="tab" type="button">A海岸默认</button><button aria-selected="false" data-scope="managed" role="tab" type="button">其他群默认</button><button aria-selected="false" data-scope="current" role="tab" type="button">命令加“群”</button></div><p class="scope-explain" data-scope-explain=""><strong>A海岸五群合榜</strong><br/>在五个 A海岸群中请求默认排行时，将五群玩家合并比较；这不是所有机器人群的总榜。</p><p class="command-line">#nte帮助 · #nte登录 · #nte查询 · #nte薄荷排行 · #nte群最强排行</p></article></div></div></section>
