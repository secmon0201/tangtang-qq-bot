<section class="section" id="capabilities"><div class="page-shell">
<div class="section-heading reveal"><div><span class="section-label">当前版本 · 九项能力</span><h2>从一句指令，到一个群自己的日常</h2></div><p>每一项都按当前群独立运行。点开卡片可查看适用场景、常用指令和生效条件。</p></div>
<aside class="availability-note reveal"><i data-lucide="shield-alert"></i><div><strong>为什么群设置显示开启，功能仍可能没有响应？</strong><p>被呼叫会话、糖糖主动聊天、小游戏、NTE 和准时报点还受机器人级运行条件约束。若维护期间临时停用，群内保存的开关不会被覆盖，恢复后仍按本群设置生效。</p></div><a href="/operator/#participation">查看权限边界 <i data-lucide="arrow-up-right"></i></a></aside>
<div class="capability-grid reveal">
<button class="capability-tile tone-pink" data-modal="signal"><span class="tile-top"><span class="tile-icon"><i data-lucide="radio-tower"></i></span><span class="tile-index">01</span></span><span class="tile-copy"><h3>枝江与 B 站信号</h3><p>查今日、明日、本周日历；按群接收动态、视频、开播和下播。</p><code>#今日直播 · #枝江直播</code></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></button>
<button class="capability-tile tone-violet" data-modal="chat"><span class="tile-top"><span class="tile-icon"><i data-lucide="message-circle-heart"></i></span><span class="tile-index">02</span></span><span class="tile-copy"><h3>被呼叫与主动聊天</h3><p>叫她名字或 @ 她进行自然会话，也可按群开启低频主动接话。</p><code>糖糖，看看本月发言榜</code></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></button>
<button class="capability-tile tone-mint" data-modal="wife"><span class="tile-top"><span class="tile-icon"><i data-lucide="heart-handshake"></i></span><span class="tile-index">03</span></span><span class="tile-copy"><h3>今日老婆与缘分</h3><p>从本群近期活跃成员中结缘，自动推进三幕故事与群关系图。</p><code>#今日老婆 · #群缘分</code></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></button>
<button class="capability-tile tone-gold" data-modal="games"><span class="tile-top"><span class="tile-icon"><i data-lucide="gamepad-2"></i></span><span class="tile-index">04</span></span><span class="tile-copy"><h3>本地群聊小游戏</h3><p>转盘、两类炸弹、骰局与猜数都在当前群即时开局。</p><code>#游戏列表 · #装填</code></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></button>
<button class="capability-tile tone-blue" data-modal="ranking"><span class="tile-top"><span class="tile-icon"><i data-lucide="chart-no-axes-column-increasing"></i></span><span class="tile-index">05</span></span><span class="tile-copy"><h3>发言榜与定时推送</h3><p>查看本群日、周、月、总榜；集群成员可显式查看集群榜。</p><code>#发言排行 周</code></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></button>
<button class="capability-tile tone-violet" data-modal="nte"><span class="tile-top"><span class="tile-icon"><i data-lucide="orbit"></i></span><span class="tile-index">06</span></span><span class="tile-copy"><h3>NTE 查询与排行</h3><p>普通排行默认只看当前群，写出“总排行”才看机器人全部记录。</p><code>#nte薄荷排行</code></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></button>
<button class="capability-tile tone-pink" data-modal="memory"><span class="tile-top"><span class="tile-icon"><i data-lucide="archive"></i></span><span class="tile-index">07</span></span><span class="tile-copy"><h3>发言档案与画像</h3><p>记录与搜索限定当前群，画像按独群或当前私有集群读取。</p><code>#发言画像 @成员</code></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></button>
<button class="capability-tile tone-mint" data-modal="ambient"><span class="tile-top"><span class="tile-icon"><i data-lucide="sparkles"></i></span><span class="tile-index">08</span></span><span class="tile-copy"><h3>被动互动与报点</h3><p>随机表情、复读和枝江风格准时报点均可由当前群单独开关。</p><code>#群设置 被动互动 开</code></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></button>
<button class="capability-tile tone-gold" data-modal="settings"><span class="tile-top"><span class="tile-icon"><i data-lucide="sliders-horizontal"></i></span><span class="tile-index">09</span></span><span class="tile-copy"><h3>帮助与本群设置</h3><p>新群自动成为独群；群主和群管理员维护代称与本群功能。</p><code>#帮助 · #群设置</code></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></button>
</div>
</div></section>
