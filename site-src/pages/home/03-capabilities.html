<section class="section" id="capabilities"><div class="page-shell">
<div class="section-heading reveal"><div><span class="section-label">点开任意一格</span><h2>糖糖在群里的九种打开方式</h2></div><p>这里不是插件清单，而是群友真正能感受到的九种体验。每一格都能打开完整说明和常用入口。</p></div>
<div class="capability-grid reveal">
<button class="capability-tile" data-modal="signal" style="--tile-accent:var(--pink-soft)"><span class="tile-top"><span class="tile-icon"><i data-lucide="radio-tower"></i></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></span><span><h3>不错过枝江</h3><p>日历、开播、下播、动态和视频。</p></span><i class="tile-visual" data-lucide="radio"></i></button>
<button class="capability-tile" data-modal="chat" style="--tile-accent:var(--yellow)"><span class="tile-top"><span class="tile-icon"><i data-lucide="message-circle-heart"></i></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></span><span><h3>叫一声糖糖</h3><p>自然聊天，也能听懂你想查什么。</p></span><i class="tile-visual" data-lucide="messages-square"></i></button>
<button class="capability-tile" data-modal="wife" style="--tile-accent:var(--cyan)"><span class="tile-top"><span class="tile-icon"><i data-lucide="heart-handshake"></i></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></span><span><h3>今日缘分</h3><p>领取关系，等待三幕故事自动展开。</p></span><i class="tile-visual" data-lucide="heart"></i></button>
<button class="capability-tile" data-modal="games" style="--tile-accent:#d8e0ff"><span class="tile-top"><span class="tile-icon"><i data-lucide="gamepad-2"></i></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></span><span><h3>一起开一局</h3><p>转盘、炸弹、骰子、猜数和 NTE。</p></span><i class="tile-visual" data-lucide="dices"></i></button>
<button class="capability-tile" data-modal="ranking" style="--tile-accent:#d7f4df"><span class="tile-top"><span class="tile-icon"><i data-lucide="chart-no-axes-column-increasing"></i></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></span><span><h3>看看谁最活跃</h3><p>本群榜、A海岸五群合榜与每日榜。</p></span><i class="tile-visual" data-lucide="trophy"></i></button>
<button class="capability-tile" data-modal="activity" style="--tile-accent:#ffe0cf"><span class="tile-top"><span class="tile-icon"><i data-lucide="ticket-check"></i></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></span><span><h3>参加群活动</h3><p>活动大厅、报名、开奖和问卷反馈。</p></span><i class="tile-visual" data-lucide="party-popper"></i></button>

<button class="capability-tile" data-modal="knowledge" style="--tile-accent:#bdeceb"><span class="tile-top"><span class="tile-icon"><i data-lucide="book-open-text"></i></span><i class="tile-arrow" data-lucide="arrow-up-right"></i></span><span><h3>懂一点圈内话</h3><p>本地枝江百科与鸣潮梗文化检索。</p></span><i class="tile-visual" data-lucide="search"></i></button>
