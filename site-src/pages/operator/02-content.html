<section class="section" id="content"><div class="page-shell"><div class="section-heading reveal"><div><span class="section-label">内容触达</span><h2>从选择目标到确认送达</h2></div><p>公告面板与 B 站播报是两套独立能力：公告由超级管理员选择独群或集群后确认发送，B 站播报按各群开关自动识别新增内容。</p></div><div class="operator-grid reveal"><article class="operator-item"><i data-lucide="megaphone"></i><h3>公告面板</h3><p>文字、图文和原图共用同一份目标快照；集群与成员重复勾选会自动去重。</p></article><article class="operator-item"><i data-lucide="list-checks"></i><h3>独群与集群多选</h3><p>集群展开显示成员群，也可以同时选择多个独群，发送前明确显示最终群数。</p></article><article class="operator-item"><i data-lucide="radio-tower"></i><h3>B 站自动播报</h3><p>轮询动态、视频与直播状态；群管理员负责本群开关，推送源只由超级管理员维护。</p></article><article class="operator-item"><i data-lucide="calendar-range"></i><h3>日程与直播防护</h3><p>日程查询可独立开启；直播防护仅阻止新开小游戏，不改写本群小游戏开关。</p></article></div></div></section>
