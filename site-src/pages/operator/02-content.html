<section class="section" id="content"><div class="page-shell"><div class="section-heading reveal"><div><span class="section-label">内容触达</span><h2>从编辑到送达，是一条完整工作流</h2></div><p>公告和 B 站播报不是同一种能力：前者是管理员主动编辑并确认发送，后者由轮询与游标自动识别新增内容。</p></div><div class="operator-grid reveal"><article class="operator-item"><i data-lucide="megaphone"></i><h3>全局文字公告</h3><p>面向固定群范围预览、确认并广播；独立公告操作员不因此获得其他超级权限。</p></article><article class="operator-item"><i data-lucide="image-up"></i><h3>全局图片公告</h3><p>原图交付与网页预览分开处理，编辑页使用 15 分钟能力链接。</p></article><article class="operator-item"><i data-lucide="radio-tower"></i><h3>B 站自动播报</h3><p>60 秒轮询动态、视频与直播状态；首次只建游标，不回放历史内容。</p></article><article class="operator-item"><i data-lucide="calendar-range"></i><h3>日程高亮</h3><p>标记特别关注的日程，并维护高亮记录；普通日程查询仍对群友开放。</p></article></div></div></section>
