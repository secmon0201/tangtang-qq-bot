<section class="section" id="participation"><div class="page-shell"><div class="story-row"><div class="visual-board yellow reveal"><div class="board-title"><strong>跨群活动流</strong><span>CREATE → ARCHIVE</span></div><div class="architecture-flow" style="margin-top:30px"><div class="flow-node"><i data-lucide="file-plus-2"></i><strong>创建</strong><small>设置群范围与规则</small></div><div class="flow-node"><i data-lucide="send"></i><strong>公告</strong><small>向参与群送达</small></div><div class="flow-node"><i data-lucide="user-check"></i><strong>报名</strong><small>统一资格与状态</small></div><div class="flow-node"><i data-lucide="trophy"></i><strong>开奖</strong><small>留存结果</small></div><div class="flow-node"><i data-lucide="archive"></i><strong>归档</strong><small>支持恢复与查看</small></div></div></div><div class="story-copy reveal"><span class="section-label">参与协作</span><h2>活动、问卷和反馈属于同一条参与链</h2><p>活动管理员只能管理自己创建的活动；超级管理员负责全局恢复和范围。问卷公告通过群聊发起，反馈使用独立的 `###` 入口收集，避免和普通 `#` 命令混淆。</p><p class="command-line">#活动大厅 · #创建活动 · #活动管理 · #问卷 · ###反馈内容</p></div></div></div></section>
