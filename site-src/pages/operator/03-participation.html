<section class="section" id="participation"><div class="page-shell"><div class="story-row"><div class="visual-board yellow reveal"><div class="board-title"><strong>全局通知流</strong><span>VALID GROUPS ONLY</span></div><div class="announcement-flow"><div><i data-lucide="file-pen-line"></i><span class="flow-copy"><strong>准备内容</strong><small>更新日志、维护说明、恢复通知</small></span></div><div><i data-lucide="list-checks"></i><span class="flow-copy"><strong>选择范围</strong><small>独群、私有集群或成员群快照</small></span></div><div><i data-lucide="send"></i><span class="flow-copy"><strong>确认发布</strong><small>去重后发送到有效群</small></span></div></div></div><div class="story-copy reveal"><span class="section-label">公告触达</span><h2>公告不是群友命令，而是全局信息抵达方式</h2><p>当糖糖更新、维护或恢复时，维护者会向有效群发布全局信息通知。公告目标来自当前登记的独群和私有集群快照，发送前会显示去重后的目标群数量。</p><p>群管理员不需要学习公告后台；只要知道公告用于接收更新日志、维护说明和重要变更，不等同于本群功能开关。</p></div></div></div></section>
