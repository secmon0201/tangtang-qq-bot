<section class="section" id="governance"><div class="page-shell"><div class="section-heading reveal"><div><span class="section-label">权限边界</span><h2>每项操作都有明确所有者</h2></div><p>普通群友、群主与群管理员、超级管理员分别拥有不同能力；私聊不会绕过群内权限。</p></div><div class="operator-grid reveal"><article class="operator-item"><i data-lucide="route"></i><h3>本群功能开关</h3><p>小游戏、今日老婆、NTE、聊天、报点和推送等均以当前群为单位保存。</p></article><article class="operator-item"><i data-lucide="list-filter"></i><h3>群过滤</h3><p>群主与群管理员维护本群过滤名单，不影响其他独群或同集群成员群。</p></article><article class="operator-item"><i data-lucide="scan-search"></i><h3>查重与白名单</h3><p>查重仍使用独立能力链接和白名单，只有已开启查重的群会进入扫描范围。</p></article><article class="operator-item"><i data-lucide="panel-top-open"></i><h3>一次性能力网页</h3><p>公告与查重链接绑定本次会话并在 15 分钟后失效；不展示密钥、登录态或内部接口。</p></article></div></div></section>
