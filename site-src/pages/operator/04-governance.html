<section class="section" id="governance"><div class="page-shell"><div class="section-heading reveal"><div><span class="section-label">范围治理</span><h2>权限不是一个“管理员”开关</h2></div><p>普通用户、活动管理员、全局公告操作员与超级管理员各自拥有明确边界；私聊不会绕过权限。</p></div><div class="operator-grid reveal"><article class="operator-item"><i data-lucide="route"></i><h3>功能范围</h3><p>查重、本地小游戏、NTE、活动、被动互动等分别维护群范围；A海岸统计固定五群不可修改。</p></article><article class="operator-item"><i data-lucide="list-filter"></i><h3>主动 / 被动过滤</h3><p>主动过滤拦截指令与游戏操作；被动过滤排除随机互动和糖糖记忆，两份名单互相独立。</p></article><article class="operator-item"><i data-lucide="scan-search"></i><h3>跨群查重与白名单</h3><p>在允许范围内检查重复成员，白名单和扫描权限由独立服务维护。</p></article><article class="operator-item"><i data-lucide="panel-top-open"></i><h3>一次性运营网页</h3><p>`/operations/&lt;令牌&gt;` 只向超级管理员签发，15 分钟有效；不展示密钥、登录态或内部接口。</p></article></div></div></section>
