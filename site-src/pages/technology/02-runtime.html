<section class="section" id="runtime"><div class="page-shell"><div class="section-heading reveal"><div><span class="section-label">Windows 本地运行</span><h2>从 QQ 消息到业务响应</h2></div><p>当前唯一受支持的环境是 Windows 本机：Python 3.13、PowerShell、QQNT/SnowLuma、NoneBot2、OneBot v11 与 SQLite。登录、二维码、滑块、短信和设备验证都保留为人工操作。</p></div><div class="architecture-flow reveal"><div class="flow-node"><i data-lucide="message-circle-more"></i><strong>QQNT</strong><small>人工登录与设备验证</small></div><div class="flow-node"><i data-lucide="radio-receiver"></i><strong>SnowLuma</strong><small>OneBot v11 事件</small></div><div class="flow-node"><i data-lucide="bot"></i><strong>NoneBot2</strong><small>插件入口与调度</small></div><div class="flow-node"><i data-lucide="blocks"></i><strong>Services</strong><small>业务、渲染、持久化</small></div><div class="flow-node"><i data-lucide="database"></i><strong>SQLite</strong><small>本地状态与档案</small></div></div></div></section>
