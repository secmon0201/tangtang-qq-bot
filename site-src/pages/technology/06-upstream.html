<section class="section" id="upstream"><div class="page-shell"><div class="story-row"><div class="visual-board dark reveal"><div class="board-title"><strong>游戏上游隔离</strong><span>READ ONLY</span></div><div class="architecture-flow" style="margin-top:28px;color:var(--ink)"><div class="flow-node"><i data-lucide="bot"></i><strong>NoneBot</strong><small>本地接管</small></div><div class="flow-node"><i data-lucide="cable"></i><strong>Connector</strong><small>GsUID 链路</small></div><div class="flow-node"><i data-lucide="server"></i><strong>Core :8765</strong><small>独立运行</small></div><div class="flow-node"><i data-lucide="gamepad-2"></i><strong>NTE / WW</strong><small>双接口启用</small></div><div class="flow-node"><i data-lucide="database"></i><strong>本机数据</strong><small>排行只读</small></div></div></div><div class="story-copy reveal"><span class="section-label">维护策略</span><h2>上游负责上游，糖糖负责增强</h2><p>GsUID Core、NTEUID 和 XutheringWavesUID 保持干净；帮助、排行、命令接管和兼容逻辑留在 <code>bot/</code>。更新通过版本锁验证，发现上游仓库有本地改动就停止，而不是把补丁藏进 stash。</p><p>NTE 与鸣潮是当前启用的两套游戏接口。排行榜只读上游数据库或本机缓存，本仓库只负责外层体验、范围分流和公开说明。</p></div></div></div></section>
